<script>
const questions=[{"q": "Social Work with Communities is considered one of the primary methods of social work together with:", "o": ["Working with individuals, families, and small groups", "Only clinical diagnosis and psychiatric treatment", "Only social welfare administration and policy writing", "Only case recording and referral management"], "a": 0, "e": ""}, {"q": "The generalist framework is emphasized in community practice because communities are composed of:", "o": ["Only formal organizations with no individual needs", "Only public institutions and local officials", "Only people’s organizations with no family concerns", "Individuals and groups whose needs may require direct help or referral"], "a": 3, "e": ""}, {"q": "In the reviewer, working with communities is also referred to as:", "o": ["Clinical case management only", "Family intervention and genogram construction", "Community organization or community organizing", "Individual casework and psychosocial treatment"], "a": 2, "e": ""}, {"q": "The primary elements repeatedly done in CO are:", "o": ["Intake, case recording, transfer, and referral", "Education and training, mobilization, and organization building", "Assessment, diagnosis, treatment, and termination only", "Reward, punishment, extinction, and reinforcement"], "a": 1, "e": ""}, {"q": "Organization building in CO involves building structures and:", "o": ["Building capabilities to make structures work and sustain them", "Replacing community leadership with agency leadership", "Limiting participation to elected officials", "Avoiding all mechanisms and committees"], "a": 0, "e": ""}, {"q": "CO specialization expanded from micro to macro practice because community practice must address:", "o": ["Only individual emotional distress", "Only psychiatric symptoms and diagnosis", "Only direct provision of material assistance", "Changing community needs, contemporary dynamics, and effective service delivery"], "a": 3, "e": ""}, {"q": "Rothman and Tropman’s statement on macro community practice highlights competence in:", "o": ["Behavior modification and psychodynamic diagnosis", "Interviewing, referral, and termination only", "Community organization, social policy, and administration", "Casework, group therapy, and family assessment only"], "a": 2, "e": ""}, {"q": "Theoretical definitions of community emphasize people living in a geographically defined area with:", "o": ["Only membership in a formal agency program", "Common history and defined patterns of relationship", "Only shared online identity without institutions", "Only identical economic status"], "a": 1, "e": ""}, {"q": "A practice definition of community used by DSWD includes people who may or may not be spatially connected but share:", "o": ["Common interests, concerns, or identities", "Only common family names", "Only common income level", "Only common agency records"], "a": 0, "e": ""}, {"q": "The local population of 4Ps may be considered a community because it shares:", "o": ["A single household structure", "A formal clinical diagnosis", "A group therapy contract", "A common program identity or concern"], "a": 3, "e": ""}, {"q": "Community patterns are organized into institutions such as family, economy, politics, education, religion, and health to:", "o": ["Prevent development of local leadership", "Eliminate the need for social services", "Help people carry out day-to-day activities", "Replace community participation with expert control"], "a": 2, "e": ""}, {"q": "In CO, “organization” means bringing together and coordinating community resources to:", "o": ["Limit participation to service recipients only", "Meet community needs and uplift welfare", "Achieve only agency administrative goals", "Replace informal institutions with outside control"], "a": 1, "e": ""}, {"q": "Community organization is described as a sustained process of educating people to:", "o": ["Work collectively and efficiently toward short-term and long-term solutions", "Depend permanently on external agencies", "Avoid participation in community decisions", "Receive services without collective action"], "a": 0, "e": ""}, {"q": "The primary agenda of community organization is:", "o": ["Individual diagnosis only", "Case termination", "Private charity without participation", "Social change"], "a": 3, "e": ""}, {"q": "Which is a component of CO?", "o": ["Individual case recording only", "Family genogram construction only", "Formation of people’s organization", "Clinical diagnosis of personality disturbance"], "a": 2, "e": ""}, {"q": "CO as a process means it has:", "o": ["Only terminal evaluation after phase-out", "Several phases that guide development workers in communities", "Only one fixed step applied to all situations", "No monitoring or evaluation needs"], "a": 1, "e": ""}, {"q": "CO as a method means it uses:", "o": ["Strategies, tactics, and techniques that help people solve problems and become empowered", "Only agency-directed service delivery", "Only individual interviews", "Only passive information giving"], "a": 0, "e": ""}, {"q": "CO as an approach is used to:", "o": ["Avoid community participation", "Focus only on one-to-one counseling", "Replace local leadership with external experts", "Mobilize people to implement projects solving community problems"], "a": 3, "e": ""}, {"q": "The three-pronged approach to participatory development includes CO, socioeconomic work, and:", "o": ["Psychiatric treatment and case recording", "Family counseling and referral", "Networking and advocacy", "Casework and clinical therapy"], "a": 2, "e": ""}, {"q": "Networking and advocacy become important after a base organization develops clear identity and strength because organizations can:", "o": ["Transfer responsibility to outside planners only", "Join forces with others sharing causes and pursue policy or program advocacies", "Avoid alliances to protect independence", "Stop mobilization and focus on records"], "a": 1, "e": ""}, {"q": "One major objective of CO is to raise people’s awareness about poverty in order to:", "o": ["Develop critical consciousness and effect social change", "Encourage passive acceptance of conditions", "Replace participation with technical planning", "Limit organizing to livelihood projects only"], "a": 0, "e": ""}, {"q": "CO forms structures and mechanisms that uphold:", "o": ["Only agency reporting requirements", "Only local elite preferences", "Only short-term relief distribution", "Basic rights and interests"], "a": 3, "e": ""}, {"q": "Helping people harness human and material resources in CO aims to:", "o": ["Avoid local decision-making", "Replace people’s organizations with committees of experts", "Improve quality of life through community programs and projects", "Increase dependency on external agencies"], "a": 2, "e": ""}, {"q": "CO initiates advocacy and social action especially to change:", "o": ["Only case recording systems", "Community and group relationships and distribution of decision-making power", "Only individual family dynamics", "Only interview techniques"], "a": 1, "e": ""}, {"q": "Which is a basic assumption in CO?", "o": ["Communities have capacities to deal with their problems", "People cannot change without external control", "People should be excluded from decisions affecting them", "Fragmented approaches are always more effective"], "a": 0, "e": ""}, {"q": "The assumption “self-imposed change has lasting character” means change should be:", "o": ["Designed only by professionals", "Forced through agency policy", "Separated from community participation", "Owned and directed by the people rather than imposed externally"], "a": 3, "e": ""}, {"q": "The assumption that a holistic approach works better than a fragmented one implies:", "o": ["Only relief provision is needed", "Only leaders should participate", "Community problems require integrated analysis and action", "Only one sector should be studied"], "a": 2, "e": ""}, {"q": "Hypotheses about community life in the reviewer include social structures, sociocultural patterns, leadership, symbols, apathy, prejudice, and:", "o": ["Only family birth order", "Individual predisposition such as status, frame of reference, and time perspective", "Only individual psychopathology", "Only casework transference"], "a": 1, "e": ""}, {"q": "Commitment to democratic processes is central to community practice because CO values:", "o": ["Participation, self-determination, and people’s capacity to change", "Worker control and expert domination", "Passive participation and elite decision-making", "Technical planning without community consent"], "a": 0, "e": ""}, {"q": "Respect for human rights in CO is premised on:", "o": ["The superiority of professional decision-making", "The need to preserve existing power arrangements", "The priority of agency efficiency over participation", "Human worth and dignity and the right to participate in decisions affecting life"], "a": 3, "e": ""}, {"q": "Social responsibility in CO refers to:", "o": ["Agency control over all community decisions", "Avoidance of shared welfare concern", "Society’s responsibility to create conditions for opportunity and self-fulfillment", "Individual responsibility only without institutional change"], "a": 2, "e": ""}, {"q": "Social justice in CO is tied to:", "o": ["Participation only by dominant groups", "People being heard and having equal access to jobs and basic services", "Silencing grievances to maintain peace", "Development without attention to rights"], "a": 1, "e": ""}, {"q": "The CO principle “trust in people” requires organizers to:", "o": ["Deeply believe in people’s capacity", "Assume communities are passive recipients", "Let experts decide all solutions", "Avoid indigenous leadership"], "a": 0, "e": ""}, {"q": "“Start where people are” means organizing should begin with people’s:", "o": ["External agency targets only", "Formal reports only", "Long-term national agenda only", "Needs, resources, and capabilities"], "a": 3, "e": ""}, {"q": "CO is biased to the interest of the majority, meaning it is oriented toward:", "o": ["Formal organizations with power", "External funders and planners", "The poor and oppressed in society", "The dominant faction and local elites only"], "a": 2, "e": ""}, {"q": "Critical and active participation is crucial because it is an element of:", "o": ["Technical planning only", "People’s empowerment", "Passive consultation", "Resource dependency"], "a": 1, "e": ""}, {"q": "Recognizing a variety of interests in a community prevents the organizer from assuming:", "o": ["All groups have identical interests and power", "Conflicts can be analyzed", "Participation must be democratic", "People can participate in change"], "a": 0, "e": ""}, {"q": "The responsibility to direct change lies primarily with:", "o": ["The organizer alone", "The funding agency only", "The dominant faction", "The people"], "a": 3, "e": ""}, {"q": "CO is described as people-centered, process-oriented, and action-oriented because it works toward:", "o": ["Individual case closure", "External expert planning only", "Community-owned and managed programs", "Agency-owned initiatives only"], "a": 2, "e": ""}, {"q": "A wrong analysis of community reality can lead to:", "o": ["Effective organization building", "Wrong intervention", "Automatic empowerment", "Guaranteed participation"], "a": 1, "e": ""}, {"q": "The first writings on CO as a distinct field appeared in the:", "o": ["1920s", "1950s", "1970s", "2000s"], "a": 0, "e": ""}, {"q": "Two early CO themes were improvement of social provisions and services and:", "o": ["Clinical treatment of individual pathology", "Behavior modification of community members", "Family therapy and genogram work", "Changing social relationships and strengthening capacity for cooperation"], "a": 3, "e": ""}, {"q": "Since the Lane Report, CO literature increasingly considered the interrelatedness of:", "o": ["Referral and transfer processes only", "Psychiatric diagnosis and case management", "Improving social provisions and strengthening relationships/problem-solving capacities", "Direct provision and individual therapy only"], "a": 2, "e": ""}, {"q": "Arthur Dunham defined CO as a conscious process of social interaction and method of social work practice involving task, process, and:", "o": ["Behavioral goals only", "Relationship goals", "Clinical goals", "Termination goals only"], "a": 1, "e": ""}, {"q": "Dunham’s task goal refers to:", "o": ["Concrete tasks to meet needs or solve problems", "Helping people grow in participation and cooperation", "Changing social relationships and decision-making power", "Developing indigenous leadership only"], "a": 0, "e": ""}, {"q": "Dunham’s process goal refers to:", "o": ["Concrete delivery of goods and services only", "Changing power distribution only", "Research and fact-gathering only", "Helping people grow in participation, self-direction, and cooperation"], "a": 3, "e": ""}, {"q": "Dunham’s relationship goal refers to:", "o": ["Developing community association only", "Delivering agency services only", "Changing community/group relationships and decision-making power", "Completing concrete tasks only"], "a": 2, "e": ""}, {"q": "Perlman and Gurin’s four CO orientations include Ross, Lippitt, Morris and Binstock, and:", "o": ["Rothman", "Grosser", "Freire", "Alinsky"], "a": 1, "e": ""}, {"q": "Murray Ross focused on:", "o": ["Strengthening community participation and integration", "Enhancing coping capacities through change agent relationship only", "Improving services through the planner", "Advancing disadvantaged groups through power realignment"], "a": 0, "e": ""}, {"q": "Ross suggested developing a community association as a venue for:", "o": ["Replacing real leaders with external organizers", "Avoiding representation of major groups", "Focusing only on services delivery", "Actualizing the CO process"], "a": 3, "e": ""}, {"q": "Ross identified CO roles such as guide, enabler, expert, and:", "o": ["Fact-finder analyst only", "Policy legislator only", "Social therapist", "Advocate activist only"], "a": 2, "e": ""}, {"q": "Lippitt focused on improving communication and interaction to enhance:", "o": ["Casework rapport", "Coping capacities", "Policy drafting only", "Settlement house services"], "a": 1, "e": ""}, {"q": "For Lippitt, faulty distribution of power may require:", "o": ["Creation of new centers of power or internal changes", "Only public service delivery by planners", "Avoidance of power analysis", "Passive information giving"], "a": 0, "e": ""}, {"q": "For Lippitt, faulty mobilization of energy may be addressed through:", "o": ["Only legislative advocacy", "Only material incentives", "Only formal election of officers", "Rechanneling energy and avoiding internal conflict through insight"], "a": 3, "e": ""}, {"q": "For Lippitt, faulty communication and perception requires:", "o": ["Avoidance of dialogue", "Elite decision-making", "Exchange of feelings and attitudes toward mutual understanding", "Immediate conflict confrontation only"], "a": 2, "e": ""}, {"q": "Morris and Binstock focused on:", "o": ["Only popular education", "Improving social conditions and services", "Only strengthening community association", "Only class-based provocative organizing"], "a": 1, "e": ""}, {"q": "Morris and Binstock viewed the planner as a possible actor in changing:", "o": ["Organizational policies to improve services and reduce problems", "Only family communication patterns", "Only individual attitudes", "Only spiritual development"], "a": 0, "e": ""}, {"q": "Grosser’s orientation primarily promotes:", "o": ["Consensus among all groups regardless of inequity", "Technical service planning only", "Agency-led resource delivery only", "Interests, power, participation, and status of disadvantaged groups"], "a": 3, "e": ""}, {"q": "Grosser emphasized engaging the poor in:", "o": ["Individual therapy", "Formal domestic casework", "Community decision-making and negotiation in their behalf", "Passive participation for material incentives"], "a": 2, "e": ""}, {"q": "The four schemes are oriented toward social changes that improve social provision and strengthen:", "o": ["One-way information campaigns", "Relationships and problem-solving capacities", "Case recording and referral forms", "Direct clinical diagnosis"], "a": 1, "e": ""}, {"q": "In the pre-colonial era, community practice was reflected in:", "o": ["Damayan and bayanihan", "Associated Charities only", "Structural analysis and dependency theory", "Corporate social responsibility"], "a": 0, "e": ""}, {"q": "Damayan and bayanihan involved:", "o": ["Technical planning by state agencies", "Issue-based mass mobilization only", "Formal NGO development projects", "Mutual aid among kindred, clan, and barangay"], "a": 3, "e": ""}, {"q": "During the Spanish colonial era, community help was mainly characterized by:", "o": ["Government disaster relief and self-help projects", "Gender-based and rights-based approaches", "Almsgiving, charity work, and institutions for the needy", "Structural analysis and liberative education"], "a": 2, "e": ""}, {"q": "During the American colonial era, organized social welfare began with:", "o": ["Corporate social responsibility programs", "Associated Charities in 1914", "ZOTO in the 1970s", "The Social Welfare Administration in the 1950s"], "a": 1, "e": ""}, {"q": "After World War II, the government assumed firm responsibility for:", "o": ["Social welfare, disaster relief, self-help projects, relocation, and resettlement", "Only gender-responsive organizing", "Only issue-based campaigns", "Only microenterprise development"], "a": 0, "e": ""}, {"q": "The Reconstruction Period of the 1950s to 1960s involved:", "o": ["Primary focus on environmental sustainability", "Promotion of women’s movement only", "Use of HRBA as main framework", "Resource provision and rebuilding communities destroyed by war"], "a": 3, "e": ""}, {"q": "The Development Decade of the 1960s to 1970s emphasized:", "o": ["Only technology transfer in networks", "Only WAD and GAD perspectives", "Maximum community participation and coping capabilities", "Only passive relief giving"], "a": 2, "e": ""}, {"q": "Participatory Development in the 1970s to 1980s emphasized:", "o": ["Only CSR for affected communities", "Critical and active participation to gain power and assert rights", "Only agency-managed rehabilitation", "Only resource provision and infrastructure building"], "a": 1, "e": ""}, {"q": "The Zone One Tondo Organization is significant because it was:", "o": ["The first people’s organization formed since CO institutionalization", "The first Charity Organization Society", "The first government welfare office", "The first CSR program in the Philippines"], "a": 0, "e": ""}, {"q": "During Participatory Development, guiding frameworks included:", "o": ["Only locality development and consensus assumptions", "Only problem tree and SWOT analysis", "Only HRBA and CSR", "Structural Analysis and Dependency Theory"], "a": 3, "e": ""}, {"q": "The 1980s to 1990s socio-economic work period used a two-pronged approach of strengthening people’s organization and:", "o": ["Passive participation", "Corporate philanthropy only", "Socioeconomic activities", "Clinical diagnosis"], "a": 2, "e": ""}, {"q": "The EDSA Revolution is linked to the socio-economic work period because it broadened:", "o": ["Casework documentation", "Democratic space", "Clinical treatment services", "Passive welfare structures"], "a": 1, "e": ""}, {"q": "The 1990s to 2000s sustainable development period addressed:", "o": ["Resource depletion, environmental degradation, poverty, and sectoral welfare issues", "Only Associated Charities and volunteer relief", "Only construction of roads and bridges", "Only individual social functioning"], "a": 0, "e": ""}, {"q": "Today’s CO practice includes partnerships and convergence among:", "o": ["Only religious institutions", "Only government agencies", "Only international NGOs", "People’s organizations, government organizations, civil society, private institutions, and communities"], "a": 3, "e": ""}, {"q": "Current CO practice includes gender-based, rights-based approaches, DRRM, human rights work, CSR, and:", "o": ["Only Spanish almsgiving", "Only post-war relocation", "COVID-19 pandemic concerns", "Only settlement house movements"], "a": 2, "e": ""}, {"q": "Rothman’s three conceptions of community organization are:", "o": ["Issue-based, sector-based, and project-based only", "Locality Development, Social Action, and Social Planning", "Ross, Lippitt, Grosser", "Conscientization, Conflict-Confrontation, BCC-CO"], "a": 1, "e": ""}, {"q": "Locality Development or community development emphasizes:", "o": ["Democratic procedures, voluntary cooperation, self-help, indigenous leadership, and education", "Conflict against power structures as the central tactic", "Technical fact-finding and bureaucratic planning", "Redistribution of power through confrontation only"], "a": 0, "e": ""}, {"q": "The goal of Locality Development is:", "o": ["Shifting power and resources", "Problem-solving through technical planning only", "Legislation and policy reform only", "Self-help and integration of community groups"], "a": 3, "e": ""}, {"q": "Locality Development assumes:", "o": ["Consumers needing services only", "Power structures as external targets", "Common interests or reconcilable differences among groups", "Conflicting interests that are not easily reconcilable"], "a": 2, "e": ""}, {"q": "Social Action presupposes:", "o": ["A passive population receiving welfare services", "A disadvantaged segment needing organization to demand resources or justice", "A unified total community with common interests", "A technical process of service planning only"], "a": 1, "e": ""}, {"q": "Social Action seeks:", "o": ["Redistribution of power, resources, decision-making, or institutional policy change", "Only consensus through group discussion", "Only service delivery to consumers", "Only social investigation"], "a": 0, "e": ""}, {"q": "Social Planning emphasizes:", "o": ["Conflict confrontation against an enemy only", "Self-help and indigenous leadership only", "Formation of a community association only", "Technical problem-solving, rational planning, and delivery of goods/services"], "a": 3, "e": ""}, {"q": "In Social Planning, clientele are best viewed as:", "o": ["Victims in conflict with power structures", "Native leaders in people’s organizations", "Consumers and recipients of services", "Citizens in interactional problem solving"], "a": 2, "e": ""}, {"q": "In Social Action, clientele are viewed as:", "o": ["Technical planners", "Victims or disadvantaged constituencies/members", "Consumers of services only", "Citizens in consensus building"], "a": 1, "e": ""}, {"q": "In Locality Development, the practitioner roles include:", "o": ["Enabler, catalyst, coordinator, and educator", "Fact-finder, analyst, and program implementer", "Activist-advocate, agitator, and negotiator", "Broker, advocate, and activist only"], "a": 0, "e": ""}, {"q": "In Social Planning, practitioner roles include:", "o": ["Enabler, coordinator, and educator only", "Agitator and partisan broker only", "Native leader and radical only", "Expert, fact-finder, analyst, program implementer, and facilitator"], "a": 3, "e": ""}, {"q": "In Social Action, practitioner roles include:", "o": ["Educator and coordinator only", "Social therapist and guide only", "Activist-advocate, partisan broker, agitator, and negotiator", "Fact-finder and technical analyst only"], "a": 2, "e": ""}, {"q": "The medium of change in Locality Development is:", "o": ["Individual therapeutic relationships", "Small task-oriented groups", "Formal organizations and data", "Mass organizations and political process"], "a": 1, "e": ""}, {"q": "The medium of change in Social Planning is:", "o": ["Formal organizations and data", "Small task-oriented groups", "Mass organizations and political process", "Native leadership only"], "a": 0, "e": ""}, {"q": "The medium of change in Social Action is:", "o": ["Formal organizations and data only", "Small task groups only", "Individual casework interviews", "Mass organizations and political process"], "a": 3, "e": ""}, {"q": "In Locality Development, the power structure is seen as:", "o": ["Employers and sponsors only", "Oppressors to be overturned only", "Collaborators in a common venture", "External targets of change action"], "a": 2, "e": ""}, {"q": "In Social Action, the power structure is seen as:", "o": ["Neutral technical sponsors", "External target of change action", "Collaborators in a common venture", "Consumers or recipients"], "a": 1, "e": ""}, {"q": "Locality Development conceives the client population as:", "o": ["Citizens", "Consumers", "Victims", "Duty bearers only"], "a": 0, "e": ""}, {"q": "Social Planning conceives the client population as:", "o": ["Citizens", "Victims", "Revolutionaries", "Consumers"], "a": 3, "e": ""}, {"q": "Social Action conceives the client population as:", "o": ["Citizens", "Planners", "Victims", "Consumers"], "a": 2, "e": ""}, {"q": "Conscientization means:", "o": ["Technical data gathering", "Awareness and action", "Service delivery only", "Passive consultation"], "a": 1, "e": ""}, {"q": "Freire’s conscientization views social reality as involving contradictions between:", "o": ["Oppressors and oppressed", "Consumers and planners", "Citizens and facilitators", "Duty bearers and NGOs only"], "a": 0, "e": ""}, {"q": "In Freire’s view, humanization means becoming:", "o": ["A passive recipient of services", "A consumer of planned programs only", "A beneficiary of material incentives", "A subject who acts upon and transforms the world"], "a": 3, "e": ""}, {"q": "Problem-posing education differs from banking education because it:", "o": ["Avoids critical thinking and action", "Requires passive information giving", "Affirms people as beings who transform themselves and their future", "Treats learners as empty containers for expert knowledge"], "a": 2, "e": ""}, {"q": "Dialogue in Freire’s framework combines:", "o": ["Technical fact-finding and bureaucratic planning", "Reflection and action in a climate of love, humility, and hope", "Expert instruction and passive listening", "Material incentives and service access"], "a": 1, "e": ""}, {"q": "Praxis means:", "o": ["Reflection and action upon the world to transform it", "Passive acceptance of conditions", "One-way delivery of services", "External evaluation only"], "a": 0, "e": ""}, {"q": "Authentic revolution must be achieved by:", "o": ["Oppressors whose interests benefit from the old order", "External planners without people’s involvement", "Technical experts through rational planning only", "The oppressed with their leaders through dialogue and action"], "a": 3, "e": ""}, {"q": "Conflict confrontation, drawn from Alinsky, means:", "o": ["Using only consensus and group discussion", "Limiting community action to technical planning", "Unmasking oppression and bringing people face to face with it for action", "Avoiding conflict to preserve harmony"], "a": 2, "e": ""}, {"q": "The organizer in conflict confrontation does not create conflict but:", "o": ["Transfers conflict to service agencies only", "Brings existing conflict to the surface so it can be resolved", "Invents conflict to control the people", "Suppresses conflict to protect the status quo"], "a": 1, "e": ""}, {"q": "Elements of conflict confrontation include conflicting interests, mass participation, and:", "o": ["Employment of pressure", "Passive participation", "Direct service provision only", "Individual counseling"], "a": 0, "e": ""}, {"q": "Alinsky’s “Trinity” includes haves, have a little and want more, and:", "o": ["Duty bearers", "Consumers", "Citizens", "Have-nots"], "a": 3, "e": ""}, {"q": "Alinsky’s tactic principle “doing what you can with what you have” means tactics should be:", "o": ["Separated from people’s language and experience", "Limited to formal planning", "Grounded in available resources and concrete conditions", "Chosen only by external experts"], "a": 2, "e": ""}, {"q": "Native leadership in conflict-confrontation organizing means:", "o": ["Only formal officials can lead", "People themselves and indigenous leaders build the organization", "Outside experts replace local leaders", "Leadership is appointed by the funding agency"], "a": 1, "e": ""}, {"q": "BCC-CO stemmed from:", "o": ["Theology of Liberation and the church of the poor", "Rothman’s social planning model only", "Freire’s banking education", "Corporate social responsibility only"], "a": 0, "e": ""}, {"q": "BCC-CO views poverty and injustice as:", "o": ["Natural and unchangeable", "Solved only by charity from elites", "Unrelated to faith and social action", "Created by humans and therefore capable of being broken by humans"], "a": 3, "e": ""}, {"q": "BCC-CO is “basic” because it:", "o": ["Excludes non-Catholics", "Avoids poor majority participation", "Starts from the ground, is simple, and starts where people are", "Is limited to formal church officials"], "a": 2, "e": ""}, {"q": "BCC-CO is open to non-Catholics because its basis of unity is:", "o": ["Political party affiliation", "Love and service to others, especially the poor", "Formal membership in one parish only", "Technical planning and bureaucracy"], "a": 1, "e": ""}, {"q": "Gender-sensitive CO begins not by creating “projects for women” only but by:", "o": ["Spotting gender aspects in any community or organizational situation", "Separating women from all community activities", "Ignoring women’s domestic workload", "Leaving gender issues to external specialists only"], "a": 0, "e": ""}, {"q": "Gender issues in CO include marginalization, multiple burden, subordination, stereotyping, and:", "o": ["Passive participation", "Technical planning", "Resource mapping only", "Violence"], "a": 3, "e": ""}, {"q": "The largest factor in changing gender roles in the community is often:", "o": ["Budget liquidation", "Formal service delivery", "Culture", "Case recording"], "a": 2, "e": ""}, {"q": "A community organizer needs a “third eye” to:", "o": ["Select only economic projects", "Spot gender concerns that may be dormant or normalized", "Identify only formal leaders", "Avoid cultural analysis"], "a": 1, "e": ""}, {"q": "Gender sensitivity is more about how the people’s organization does things because it is:", "o": ["An attitude that must pervade all activities", "A separate project only for women", "A one-time training activity", "Only a data-gathering requirement"], "a": 0, "e": ""}, {"q": "Affirmative action in a people’s organization may include:", "o": ["Assigning women only to domestic tasks", "Excluding men from all gender discussions", "Avoiding changes in organizational policy", "Ensuring women’s representation in committees and trainings"], "a": 3, "e": ""}, {"q": "Microenterprise development in CO should:", "o": ["Be led by the same few leaders to centralize control", "Serve only as an entry point even if it divides members", "Complement and strengthen the people’s organization’s political agenda", "Replace organizing as the primary agenda"], "a": 2, "e": ""}, {"q": "When microenterprise leadership is concentrated in the same few PO leaders, risks include divided attention, dictatorship, demoralization, factionalism, and:", "o": ["Structural analysis", "Finance opportunism", "Interactive participation", "Self-mobilization"], "a": 1, "e": ""}, {"q": "A human rights-based approach equates development with:", "o": ["Realization of human rights for all", "Only economic growth", "Passive service delivery", "Corporate philanthropy"], "a": 0, "e": ""}, {"q": "HRBA has two-fold objectives: empower rights holders and:", "o": ["Replace duty bearers with NGOs", "Limit accountability to beneficiaries only", "Avoid participation in decision-making", "Strengthen duty bearers to respect, protect, and fulfill rights"], "a": 3, "e": ""}, {"q": "Rights holders are:", "o": ["Only service providers", "Only members of NGOs", "All human beings entitled to claim rights and hold duty bearers accountable", "Only government officials"], "a": 2, "e": ""}, {"q": "Duty bearers are state and non-state actors with obligations to:", "o": ["Avoid accountability", "Respect, protect, and fulfill rights", "Receive services only", "Claim benefits without responsibility"], "a": 1, "e": ""}, {"q": "HRBA principles include direct links to human rights, non-discrimination, empowerment, accountability, transparency, and:", "o": ["Participation", "Passive participation", "Technical neutrality only", "Material incentives only"], "a": 0, "e": ""}, {"q": "Corporate Social Responsibility in CO refers to:", "o": ["People’s independent mobilization without institutions", "Only government welfare provision", "Only local church organizing", "Social services and helping programs for a corporation’s affected communities"], "a": 3, "e": ""}, {"q": "Issue-based organizing is characterized by:", "o": ["Only sectoral service provision", "Passive consultation", "Quick action response or mass mobilization around an issue", "Long-term project delivery without mobilization"], "a": 2, "e": ""}, {"q": "Project/program-based organizing is linked with:", "o": ["Only policy advocacy without programs", "A project or program that should empower people and become part of community life", "Pure protest without service components", "Only spontaneous self-mobilization"], "a": 1, "e": ""}, {"q": "Sector-based organizing focuses on:", "o": ["Needs and interests of a particular sector", "Only total geographic community regardless of sector", "Only technical service planning", "Only corporate affected communities"], "a": 0, "e": ""}, {"q": "Multi-sectoral organizing involves:", "o": ["Only one sector’s internal concerns", "Only external planners", "Only individual clients", "Various sectors in joint effort to address an issue"], "a": 3, "e": ""}, {"q": "Rights-based organizing is premised on development as a right and poverty as:", "o": ["Only absence of technical expertise", "Only a temporary project issue", "A human rights violation or deterrent to human conditions", "Only individual failure"], "a": 2, "e": ""}, {"q": "In Karina David’s typology, the apologetic perspective views society as:", "o": ["A gender system in all aspects", "Viable based on consensus and reciprocity", "Essentially viable but needing reform due to aberration", "Exploitative and needing overhaul"], "a": 1, "e": ""}, {"q": "In the liberal perspective, the existing system is viewed as:", "o": ["Essentially viable but needing alteration of aspects due to aberration", "Completely viable and needing no change", "Exploitative and requiring total overhaul", "A church of the poor"], "a": 0, "e": ""}, {"q": "In the liberative perspective, society is viewed as requiring:", "o": ["Minor technical reform only", "Strengthening of existing system only", "Passive participation", "Overhaul because it is based on exploitation"], "a": 3, "e": ""}, {"q": "In Karina David’s typology, the apologetic change agent is described as:", "o": ["Revolutionary", "Catalyst", "Techno-fascist", "Reformist"], "a": 2, "e": ""}, {"q": "In Karina David’s typology, the liberal change agent is:", "o": ["Planner only", "Reformist", "Techno-fascist", "Revolutionary"], "a": 1, "e": ""}, {"q": "In Karina David’s typology, the liberative change agent is:", "o": ["Revolutionary", "Reformist", "Techno-fascist", "Broker only"], "a": 0, "e": ""}, {"q": "The liberative perspective emphasizes:", "o": ["Attitudes only", "Tactics and process orientation only", "Service delivery only", "Consciousness raising and objective needs"], "a": 3, "e": ""}, {"q": "The liberal perspective emphasizes:", "o": ["Consciousness raising only", "Passive information giving", "Tactics and process orientation", "Attitudes only"], "a": 2, "e": ""}, {"q": "Women in Development focuses on:", "o": ["Removing women from development programs", "Integrating women into the development process and increasing productivity", "Analyzing gender relations as the central category", "Only relation between patriarchy and capitalism"], "a": 1, "e": ""}, {"q": "Women and Development argues that women:", "o": ["Have been part of development but not recognized", "Should only be recipients of development fruits", "Are unrelated to capitalist and patriarchal relations", "Should be excluded from planning phases"], "a": 0, "e": ""}, {"q": "Gender and Development uses as category of analysis:", "o": ["Women only", "Household productivity only", "Material incentives", "Gender relations"], "a": 3, "e": ""}, {"q": "GAD views men as:", "o": ["Unrelated to gender work", "Duty bearers only", "Potential supporters", "Always external targets only"], "a": 2, "e": ""}, {"q": "GAD aims for development that is:", "o": ["Limited to domestic roles", "Sustainable, equitable, and includes women and men as decision makers", "Women-only and project-centered", "Only productivity-oriented"], "a": 1, "e": ""}, {"q": "GAD also aims to change power structure toward:", "o": ["Equal distribution of power and benefits to men and women", "Women’s integration without power change", "Recognition only without participation", "Technical training only"], "a": 0, "e": ""}, {"q": "CO phases are called phases rather than steps because:", "o": ["They are always done one time only", "They have no relation to problem-solving", "They exclude monitoring and evaluation", "They may overlap while organizing continues and learning deepens"], "a": 3, "e": ""}, {"q": "The helping process in CO includes assessment, planning, implementation, evaluation, and:", "o": ["Case recording only", "Reward and punishment", "Termination/phase-out", "Diagnosis only"], "a": 2, "e": ""}, {"q": "A key difference between problem-solving and helping process is that the helping process implies:", "o": ["No participation", "A relationship between people and the helping professional", "No assessment or planning", "Only technical analysis"], "a": 1, "e": ""}, {"q": "The four major CO phases include social preparation, leadership development/capability building, organizational development/management, and:", "o": ["Consolidation and expansion/phase-out", "Clinical diagnosis and treatment planning", "Private pre-group and public pre-group", "Intake and case recording"], "a": 0, "e": ""}, {"q": "Inherent CO processes throughout organizing include:", "o": ["Reward, punishment, and extinction", "Transfer, referral, and termination only", "Diagnosis, prognosis, and treatment", "Documentation, monitoring, and evaluation"], "a": 3, "e": ""}, {"q": "Documentation involves:", "o": ["Only appraisal of ongoing projects", "Only election of officers", "Gathering and organizing data or materials about issues, programs, or problems", "Only final outcome judgment"], "a": 2, "e": ""}, {"q": "Adequate documentation answers:", "o": ["Only the project budget", "Who, what, when, where, and why", "Only who and how much", "Only the final outcome"], "a": 1, "e": ""}, {"q": "Monitoring is:", "o": ["Appraising the status of ongoing programs or interventions within a period", "Assessing final outcomes only", "Conducting social investigation only", "Organizing the core group only"], "a": 0, "e": ""}, {"q": "Evaluation assesses:", "o": ["Only attendance in meetings", "Only preliminary information", "Only community entry activities", "Achievement of goals/objectives and how they were achieved"], "a": 3, "e": ""}, {"q": "Groundworking is:", "o": ["Formal election of officers only", "Only data gathering by survey", "Preparatory activity with individuals or small groups before mobilization or meetings", "Final phase-out after program completion"], "a": 2, "e": ""}, {"q": "Follow-up activities are conducted after mobilization to:", "o": ["Avoid monitoring and evaluation", "Check impact, clarity, concerns, and needed follow-through", "Select the area initially", "Replace documentation"], "a": 1, "e": ""}, {"q": "Contact building is an initial way of:", "o": ["Meeting many people and exploring potential participation", "Conducting deep social investigation only", "Finalizing the constitution and bylaws", "Ending the program"], "a": 0, "e": ""}, {"q": "Social preparation lays the groundwork for:", "o": ["Final phase-out only", "Only officer elections", "Only network advocacy campaigns", "The organizing program"], "a": 3, "e": ""}, {"q": "General strategies in social preparation include consultations, contact building, mapping, and:", "o": ["Federation building", "Terminal evaluation", "Actual planning", "Committee formation"], "a": 2, "e": ""}, {"q": "Institutional preparation includes review of VMG, program orientation, staff selection, staff orientation, and:", "o": ["MOA creation only", "Site selection and validation", "Election of officers", "Project phase-out"], "a": 1, "e": ""}, {"q": "Before establishing a community program, the agency should consider:", "o": ["Organization capacity, community needs, and mutual acceptability", "Only funder interest", "Only organizer preference", "Only political affiliation"], "a": 0, "e": ""}, {"q": "Area selection includes consultations/interviews with stakeholders, document review, surveys, observation, and:", "o": ["Final officer election", "Policy advocacy only", "Federation building", "Site visits"], "a": 3, "e": ""}, {"q": "Sample area-selection criteria include relatively depressed community, lack of social services, and:", "o": ["Absence of local residents", "Availability of corporate sponsors only", "Strategic contiguous location for expansion", "Presence of strong elite control only"], "a": 2, "e": ""}, {"q": "Community entry includes local consultations, meetings with groups/agencies, house-to-house visits, and:", "o": ["Formation of federation first", "Launching the CO program formally or informally", "Immediate phase-out", "Election of officers without orientation"], "a": 1, "e": ""}, {"q": "During community entry, adopting a low-key profile means:", "o": ["Avoiding unrealistic expectations and promises", "Avoiding all interaction with residents", "Promising immediate services to gain support", "Using a commercial relationship"], "a": 0, "e": ""}, {"q": "A commercial relationship should be avoided because CO requires:", "o": ["Material incentives as the main participation method", "Paid membership in all activities", "Agency dominance over residents", "Trust, participation, and credibility beyond transactions"], "a": 3, "e": ""}, {"q": "Community integration is the process of:", "o": ["Conducting only staff orientation", "Creating the constitution and bylaws", "Imbibing community life through shared experiences and participation", "Writing the final evaluation report"], "a": 2, "e": ""}, {"q": "Community integration activities include same experiences, social/economic activities, house visits, and:", "o": ["Only policy briefing", "Informal group conversations", "Only external technical training", "Only officer election"], "a": 1, "e": ""}, {"q": "Social investigation is a systematic, continuing process of gathering information to identify:", "o": ["Forces that promote or impede change", "Only residents’ names", "Only election results", "Only agency funding sources"], "a": 0, "e": ""}, {"q": "Methods in social investigation include ocular visits, key informant interviews, dynamic interaction, document review, FGD, and:", "o": ["Officer appointments only", "Phase-out rituals", "Tax accounting", "Community meetings"], "a": 3, "e": ""}, {"q": "Preliminary social investigation answers:", "o": ["Only final results", "Only resource mobilization", "Who, what, when, and where", "Why and how in deep causal relationships only"], "a": 2, "e": ""}, {"q": "Deepening social investigation focuses more on:", "o": ["Only staff orientation", "Relationships, interrelationships, and causes of community problems", "Only initial demographic profile", "Only formal program launching"], "a": 1, "e": ""}, {"q": "Gender analysis examines:", "o": ["Differences in men’s and women’s lives and causes of inequities", "Only economic classes and production relations", "Only organizational strengths and weaknesses", "Only hazard exposure"], "a": 0, "e": ""}, {"q": "Class analysis examines:", "o": ["Gender roles and domestic burden only", "Community hazards and coping mechanisms", "Positive organizational strengths only", "Stratification of people into dynamic classes and relations among them"], "a": 3, "e": ""}, {"q": "Structural analysis examines:", "o": ["Only training needs of leaders", "Only project feasibility", "Structures and institutions and how power relations promote or hinder change", "Only individual motivation"], "a": 2, "e": ""}, {"q": "Appreciative Inquiry builds on:", "o": ["Only hazard exposure", "Positive goodness of a person, situation, or organization", "Only deficits and problems", "Only class conflict"], "a": 1, "e": ""}, {"q": "The Appreciative Inquiry cycle includes discover, dream, design, and:", "o": ["Destiny or deliver", "Diagnose", "Debate", "Dependency"], "a": 0, "e": ""}, {"q": "Cultural analysis examines:", "o": ["Only formal agency policy", "Only resource mobilization", "Only women’s productivity", "Traditions, values, beliefs, and practices that promote or hinder democratic action"], "a": 3, "e": ""}, {"q": "A problem tree helps analyze:", "o": ["Only gender-disaggregated data", "Only organizational elections", "Major problems and causal relationships as causes and effects around a focal problem", "Only strengths and opportunities"], "a": 2, "e": ""}, {"q": "Community Risk, Damage and Assessment determines:", "o": ["Only leadership credibility", "Nature, scope, and magnitude of hazard effects and vulnerability", "Only organizational bylaws", "Only committee membership"], "a": 1, "e": ""}, {"q": "Elements at risk in community risk assessment include people, structures, facilities, livelihood, equipment, crops, livestock, and:", "o": ["Lifelines such as roads and bridges", "Only political leaders", "Only agency documents", "Only training attendance"], "a": 0, "e": ""}, {"q": "The three major concerns in leadership development and capability building are popular participation, capability building, and:", "o": ["Terminal evaluation", "Corporate social responsibility", "Passive information giving", "Community action"], "a": 3, "e": ""}, {"q": "Spotting potential leaders involves observing characteristics, preparing profiles, validating information, giving tasks, assessing performance, and:", "o": ["Avoiding informal leaders", "Selecting only formal officials", "Helping develop self-confidence and credibility", "Immediately appointing them permanently"], "a": 2, "e": ""}, {"q": "Potential indigenous leaders are identified during:", "o": ["Corporate networking only", "Community integration and social investigation", "Phase-out only", "Final evaluation only"], "a": 1, "e": ""}, {"q": "A sample criterion for potential leaders is that the person:", "o": ["Belongs to the sector being organized", "Is always a formal official", "Has no time for the organization", "Avoids community issues"], "a": 0, "e": ""}, {"q": "Other leader criteria include interest in community issues, receptiveness to change, credibility, analytical mind, communication skill, and:", "o": ["High income only", "External agency employment", "Political appointment", "Willingness and time for the organization"], "a": 3, "e": ""}, {"q": "The core group serves as:", "o": ["A closed elite decision-making body", "A final phase-out committee only", "Training ground for shared leadership and direction in organizing activities", "Replacement for the general assembly"], "a": 2, "e": ""}, {"q": "The core group is more advanced than other leaders in commitment, group interest, leadership skills, and:", "o": ["Ability to avoid mobilization", "Awareness of community issues", "Formal appointment by agency", "Access to outside funds only"], "a": 1, "e": ""}, {"q": "Shared leadership means sharing:", "o": ["Opinions, responsibilities, problems, and merits", "Only titles and allowances", "Only administrative signatures", "Only formal authority"], "a": 0, "e": ""}, {"q": "Capacity building of the core group includes groundwork/follow-up, discussions, trainings, and:", "o": ["Immediate federation building", "Final phase-out", "Only external monitoring", "Individual and group mobilization"], "a": 3, "e": ""}, {"q": "Setting up the organization includes consultations, group activities, actual formation, GA establishment, officer election, bylaws, and:", "o": ["Passive consultation only", "Hazard mapping only", "Direction setting", "Immediate termination"], "a": 2, "e": ""}, {"q": "A people’s organization facilitates wider participation, common needs identification, group awareness, collective action, and:", "o": ["Avoidance of VMG formulation", "Strengthening local mechanisms for sustained action", "Dependency on organizer decisions", "Passive receipt of services"], "a": 1, "e": ""}, {"q": "Principles in setting up an organization include maximum participation, maximum member control, simplicity of structure, and:", "o": ["Collective and shared leadership", "Centralized authority in one leader", "Complex structure with many unnecessary committees", "External control by the organizer"], "a": 0, "e": ""}, {"q": "A strong organization is in constant action because:", "o": ["Action should be avoided until phase-out", "Only meetings matter", "Only documentation builds power", "Action is the lifeblood of an organization"], "a": 3, "e": ""}, {"q": "Reactive organizational development occurs when:", "o": ["An organization expands after full consolidation", "An organization has no need for improvement", "Past problems require redefining goals and strategies", "A new organization is being formed for the first time"], "a": 2, "e": ""}, {"q": "Consolidation in organizational development involves:", "o": ["Ending all programs", "Synthesizing gains and assessing strengths/weaknesses to improve strategies", "Initial social preparation only", "Avoiding member participation"], "a": 1, "e": ""}, {"q": "Expansion occurs when an organization is ready to:", "o": ["Expand scope, membership, services, alliances, and networks", "Reduce participation and services", "Stop networking", "Dissolve after social investigation"], "a": 0, "e": ""}, {"q": "Committee formation provides structure for:", "o": ["Organizer-only decision-making", "Rigid elite control", "Individual casework services", "Shared responsibility and collective action"], "a": 3, "e": ""}, {"q": "Committee membership should be:", "o": ["Limited to external professionals", "Exclusive to funders", "Equitably shared and distributed among members", "Assigned only to the same leaders"], "a": 2, "e": ""}, {"q": "Before officer elections, general membership should be oriented to:", "o": ["Only social investigation findings", "Roles and responsibilities of officers", "Only campaign slogans", "Only financial incentives"], "a": 1, "e": ""}, {"q": "Strategic planning and systems setup include flow of communication, decision-making processes, program policies, and:", "o": ["Organizational policies", "Casework diagnosis", "Individual treatment plans only", "Gender-neutral assumptions"], "a": 0, "e": ""}, {"q": "Organization consolidation involves strengthening commitment/capabilities, preparing for complex tasks, deepening awareness, and:", "o": ["Ending participation", "Avoiding policies", "Skipping consultation", "Strengthening group unity to respond to bigger issues"], "a": 3, "e": ""}, {"q": "Strengthening organizational mechanisms includes policies, participation venues, communication flow, meetings, consultations, action planning, and:", "o": ["Abolishing committees", "Replacing local leaders", "Summing-up sessions", "Passive information giving"], "a": 2, "e": ""}, {"q": "Group projects in consolidation are two-pronged because they serve as immediate response and:", "o": ["External agency requirement only", "Consolidation/strengthening activity for the organization", "Replacement for political agenda", "Reason to stop education sessions"], "a": 1, "e": ""}, {"q": "Economic projects should be undertaken only after:", "o": ["Group processes have been institutionalized and practiced", "The first consultation with officials", "Phase-out begins", "All leaders are replaced"], "a": 0, "e": ""}, {"q": "Resource mobilization emphasizes that the most important resources are:", "o": ["External funds only", "Formal documents only", "Local officials only", "People"], "a": 3, "e": ""}, {"q": "Resource build-up may include membership dues, local/outside resources, project proposals, bookkeeping, and:", "o": ["Only CSR donation", "Only legislative advocacy", "Systematic financial procedures", "Passive participation"], "a": 2, "e": ""}, {"q": "Group mobilization may be built around:", "o": ["Only case recording", "Local issues, programs, projects, or campaigns", "Only final evaluation", "Only staff orientation"], "a": 1, "e": ""}, {"q": "For initial mobilization, an issue should ideally have:", "o": ["High probability of success", "No relation to people’s concerns", "Low support potential", "Unclear expectations"], "a": 0, "e": ""}, {"q": "Role playing sessions may be used in mobilization to:", "o": ["Replace community analysis", "Avoid participation", "Finalize bylaws only", "Prepare groups for certain actions"], "a": 3, "e": ""}, {"q": "A consolidated organization shows active member participation, delegated responsibility, resource contribution, and:", "o": ["Weak communication mechanisms", "No external relations", "Committed/shared leadership with second liners", "Dependence on a single personality"], "a": 2, "e": ""}, {"q": "A consolidated organization’s external relations include:", "o": ["No support groups", "Networking, alliances, advocacy, campaigns, and nondependency on outside support", "Avoiding local-national links", "Depending entirely on funders"], "a": 1, "e": ""}, {"q": "Expansion involves recruitment, new chapters, federation building, and:", "o": ["Geographical expansion", "Social investigation only", "Case termination", "Passive information giving"], "a": 0, "e": ""}, {"q": "Phase-out requires preparation such as:", "o": ["Sudden pull-out without mechanisms", "Ending all relationships without referral", "Dissolving people’s organization", "Linkages, networks, organizational skills, leadership skills, coalitions, and alliances"], "a": 3, "e": ""}, {"q": "Networking is a means for advancing agenda, utilizing resources, mobilizing support, and:", "o": ["Avoiding accountability", "Terminating advocacy", "Collaboration, complementation, and coordination", "Replacing people’s organizations"], "a": 2, "e": ""}, {"q": "Key elements of networking include common interest, collaboration, shared responsibility, communication, and:", "o": ["No mutual communication", "Partnership of equals with possible lead coordinator", "Dominance of one institution", "No accountability measures"], "a": 1, "e": ""}, {"q": "A good network should respect:", "o": ["Institutional identity and autonomy among partners", "Only the lead agency’s identity", "No checks and balances", "No expectation setting"], "a": 0, "e": ""}, {"q": "Advocacy is public support for a cause or issue aimed at influencing lawmakers, agencies, or:", "o": ["Only internal committees", "Only individual clients", "Only case records", "Public opinion"], "a": 3, "e": ""}, {"q": "Policy advocacy aims to:", "o": ["Conduct only service delivery", "Build community entry only", "Propose new policies or change existing ones", "Amend or introduce laws only"], "a": 2, "e": ""}, {"q": "Legislative advocacy aims to:", "o": ["Only create a microenterprise", "Amend or introduce laws or policies affecting a community or sector", "Only build a core group", "Only conduct community mapping"], "a": 1, "e": ""}, {"q": "Advocacy campaigns are primarily educational and involve issue analysis and:", "o": ["Desired response", "Officer election", "Area selection", "Committee membership only"], "a": 0, "e": ""}, {"q": "A CO facilitator helps manage group strengths, weaknesses, conflicts, common interests, and:", "o": ["Only budget liquidation", "Only technical research", "Only final phase-out", "Group unity"], "a": 3, "e": ""}, {"q": "A CO trainor assesses training needs, conducts education programs, trains leaders, and engages:", "o": ["Top-down decision-making", "Only legislative lobbying", "Praxis through continuous dialogue with people", "Passive transfer of information only"], "a": 2, "e": ""}, {"q": "A CO advocate helps analyze/articulate issues and:", "o": ["Focus only on documentation", "Evoke meaningful discussions", "Avoid political issues", "Replace people’s voices"], "a": 1, "e": ""}, {"q": "A CO researcher conducts social analysis and participatory research where people become:", "o": ["Co-investigators", "Passive respondents only", "Recipients of findings only", "External evaluators only"], "a": 0, "e": ""}, {"q": "A CO planner helps local groups plan strategies and:", "o": ["Avoid action", "Suppress local leadership", "Only write agency reports", "Systematize group action toward desired goals"], "a": 3, "e": ""}, {"q": "A CO catalyst initiates discussions/action on critical problems and:", "o": ["Avoids structural issues", "Focuses only on individual services", "Nurtures growth toward long-term transformation", "Controls all activities directly"], "a": 2, "e": ""}, {"q": "Irreverence as a CO quality means questioning dominant traditions, laws, or values when they:", "o": ["Require documentation", "Run counter to people’s interests", "Are supported by local elites", "Are difficult to analyze"], "a": 1, "e": ""}, {"q": "Tenacity is needed because organizing is:", "o": ["Painstaking, tedious, and requires persistence", "Always quick and dramatic", "Only a one-time event", "Mainly clerical work"], "a": 0, "e": ""}, {"q": "Flexibility means the organizer can:", "o": ["Abandon goals whenever challenged", "Avoid monitoring and evaluation", "Follow one fixed plan regardless of context", "Adapt plans to changing situations while pursuing goals"], "a": 3, "e": ""}, {"q": "Ability to acculturate means:", "o": ["Avoiding immersion", "Working only with formal leaders", "Learning and integrating into people’s lifeways, culture, and language", "Replacing local culture with agency culture"], "a": 2, "e": ""}, {"q": "The Baranganic Approach was first discussed during the DSSD National Management Conference in:", "o": ["1986", "1976", "1914", "1939"], "a": 1, "e": ""}, {"q": "The Baranganic Approach is founded on active participation of people and shared responsibility among:", "o": ["Government, public, private, and religious/community sectors", "Only government agencies", "Only private corporations", "Only religious institutions"], "a": 0, "e": ""}, {"q": "The Baranganic Approach values democratic processes, self-determination, capacity to change, dignity, and:", "o": ["Passive participation", "Technical planning only", "Corporate tax cover", "Social justice"], "a": 3, "e": ""}, {"q": "A goal of the Baranganic Approach is to develop barangay capacity for:", "o": ["Passive receiving of services", "Avoiding data use", "Planning, problem solving, and decision-making", "Individual therapy only"], "a": 2, "e": ""}, {"q": "The Barangay Development Council is assisted to use data for:", "o": ["Only phase-out documentation", "Realistic, comprehensive, and integrated development planning", "Only political campaigning", "Only household counseling"], "a": 1, "e": ""}, {"q": "Participatory Rural Appraisal emphasizes:", "o": ["Community people doing their own assessment and planning", "External experts extracting data without feedback", "Only material incentives", "Only formal legislative advocacy"], "a": 0, "e": ""}, {"q": "SWOT analysis identifies strengths, weaknesses, opportunities, and:", "o": ["Tactics", "Targets", "Tasks", "Threats"], "a": 3, "e": ""}, {"q": "Force Field Analysis identifies:", "o": ["Stakeholder interests only", "Organizational bylaws only", "Driving and restraining forces of a problem", "Gender roles only"], "a": 2, "e": ""}, {"q": "Stakeholder Analysis identifies key actors, their interests, and:", "o": ["Only publication topics", "Involvement related to initiatives or resources", "Only internal weaknesses", "Only hazard damage"], "a": 1, "e": ""}, {"q": "Appreciative Planning and Action focuses mainly on:", "o": ["Positives and successes rather than problem orientation", "Only class struggle", "Only external threats", "Only gender inequities"], "a": 0, "e": ""}, {"q": "A writeshop is used to:", "o": ["Elect officers", "Conduct disaster risk assessment only", "Provide material incentives", "Produce publications through stakeholders pooling resources and knowledge"], "a": 3, "e": ""}, {"q": "Participatory training emphasizes:", "o": ["One-way expert instruction", "Passive listening only", "Sharing experiences and equal relationships between trainers and participants", "Technicalities over participation"], "a": 2, "e": ""}, {"q": "Passive participation occurs when people participate because:", "o": ["They control all decisions", "They are told to do so", "They jointly assess and plan action", "They independently initiate systems change"], "a": 1, "e": ""}, {"q": "Participation in information giving occurs when people mainly:", "o": ["Answer questions for extractive research without input to proceedings", "Jointly form local institutions", "Take independent initiatives", "Negotiate legislation"], "a": 0, "e": ""}, {"q": "Participation by consultation occurs when:", "o": ["People independently initiate change", "People share control of analysis and action planning", "People form new institutions through joint assessment", "External professionals consult people but predefine problems and solutions"], "a": 3, "e": ""}, {"q": "Participation for material incentives occurs when people participate mainly for:", "o": ["Joint assessment and institution building", "Conscientization and praxis", "Expected material rewards such as food-for-work or cash-for-work", "Self-mobilized systems change"], "a": 2, "e": ""}, {"q": "Functional participation happens when people form groups to realize:", "o": ["Only passive announcements", "Predetermined project objectives initiated by external organizations", "Independent initiatives without external institutions", "Only extractive research questions"], "a": 1, "e": ""}, {"q": "Interactive participation involves:", "o": ["Joint assessment, action planning, and strengthening or forming local institutions", "Being told what to do by administrators", "Answering extractive research questions only", "Participating only for material incentives"], "a": 0, "e": ""}, {"q": "Self-mobilization means people:", "o": ["Participate only when paid", "Respond only to external consultation", "Form groups only for predetermined projects", "Take independent initiatives to change systems without relying on external institutions"], "a": 3, "e": ""}, {"q": "A community organizer begins by holding courtesy calls with barangay officials, explaining objectives, avoiding promises, and launching the program informally. This is:", "o": ["Phase-out", "Federation building", "Community entry", "Consolidation"], "a": 2, "e": ""}, {"q": "An organizer lives with residents, joins daily activities, and conducts informal conversations to understand lifeways. This is:", "o": ["Policy advocacy", "Community integration", "Area selection", "Network advocacy"], "a": 1, "e": ""}, {"q": "A worker gathers data on political climate, leadership patterns, livelihood, social services, and possible organizing issues. This is:", "o": ["Preliminary social investigation", "Phase-out", "Legislative advocacy", "Self-mobilization"], "a": 0, "e": ""}, {"q": "After identifying water access as an issue, the organizer studies relationships among local officials, households, water providers, and causes of unequal access. This is:", "o": ["Passive participation", "General assembly election", "Corporate social responsibility", "Deepening social investigation"], "a": 3, "e": ""}, {"q": "A community has many concerns, but the organizer chooses a campaign affecting many residents and likely to succeed. This follows guidance for:", "o": ["Area selection only", "Baranganic philosophy only", "Group mobilization", "Passive participation"], "a": 2, "e": ""}, {"q": "Residents are asked to attend a meeting because officials told them to, but they cannot give input. This is:", "o": ["Functional participation", "Passive participation", "Interactive participation", "Self-mobilization"], "a": 1, "e": ""}, {"q": "Residents answer survey questions, but findings are not shared or checked with them. This is:", "o": ["Participation in information giving", "Participation by consultation", "Interactive participation", "Self-mobilization"], "a": 0, "e": ""}, {"q": "External professionals ask residents for feedback on a pre-designed program and may adjust details. This is:", "o": ["Passive participation", "Self-mobilization", "Interactive participation", "Participation by consultation"], "a": 3, "e": ""}, {"q": "Residents join road repair because they will receive cash-for-work. This is:", "o": ["Interactive participation", "Popular education", "Participation for material incentives", "Self-mobilization"], "a": 2, "e": ""}, {"q": "A group is formed by an NGO to implement a predetermined sanitation project and may later become independent. This is:", "o": ["Participation in information giving", "Functional participation", "Passive participation", "Self-mobilization"], "a": 1, "e": ""}, {"q": "Residents jointly analyze flooding, prepare an action plan, and strengthen their local disaster committee. This is:", "o": ["Interactive participation", "Participation by consultation", "Passive participation", "Participation for material incentives"], "a": 0, "e": ""}, {"q": "A fisherfolk association independently organizes to challenge destructive fishing policies without waiting for outside agencies. This is:", "o": ["Functional participation", "Participation by consultation", "Passive participation", "Self-mobilization"], "a": 3, "e": ""}, {"q": "A CO worker builds an organization around threats to housing demolition and quickly mobilizes people to pressure an agency. This is:", "o": ["Sector-based organizing only", "Locality development only", "Issue-based organizing", "Project/program-based organizing"], "a": 2, "e": ""}, {"q": "A livelihood project becomes the entry point and is intended to empower residents and begin organizing. This is:", "o": ["Passive participation", "Project/program-based organizing", "Issue-based organizing only", "Policy advocacy only"], "a": 1, "e": ""}, {"q": "An organizer focuses on farmers’ needs as a specific group requiring organization. This is:", "o": ["Sector-based organizing", "Multi-sectoral organizing", "Community-wide social planning only", "Corporate social responsibility"], "a": 0, "e": ""}, {"q": "Farmers, women, youth, and transport groups collaborate to address a mining issue. This is:", "o": ["Sector-based organizing only", "Passive participation", "Clinical case management", "Multi-sectoral organizing"], "a": 3, "e": ""}, {"q": "A community campaign frames lack of safe water as a violation of rights and demands accountability from duty bearers. This is:", "o": ["Participation for material incentives", "Direct service provision only", "Rights-based approach", "Apologetic perspective"], "a": 2, "e": ""}, {"q": "A community organizer selects confrontation because negotiation failed and power holders deny rights. This is closest to:", "o": ["Technical social planning only", "Social Action/conflict-confrontation", "Locality Development consensus strategy", "Passive participation"], "a": 1, "e": ""}, {"q": "A planner uses research, data, and feasibility analysis to improve health service delivery. This is:", "o": ["Social Planning", "Social Action", "Liberative organizing only", "Self-mobilization only"], "a": 0, "e": ""}, {"q": "A whole barangay works through dialogue and consensus to improve community integration and self-help. This is:", "o": ["Social Action", "Conflict-confrontation only", "Legislative advocacy only", "Locality Development"], "a": 3, "e": ""}, {"q": "A disadvantaged urban poor group negotiates for a larger share of city services and challenges denial of rights. This is closest to:", "o": ["Morris and Binstock’s technical planning only", "Baranganic data gathering only", "Grosser’s advancing disadvantaged groups", "Ross’s community association only"], "a": 2, "e": ""}, {"q": "A community lacks communication and has distorted perceptions among subgroups. An organizer facilitates exchange of feelings and attitudes. This follows:", "o": ["Microenterprise development", "Lippitt’s enhancing coping capacities", "Dunham’s task goal only", "Rothman’s social planning only"], "a": 1, "e": ""}, {"q": "A people’s organization is visible, serious, multi-issue, constantly in action, and develops new leaders. This describes:", "o": ["Characteristics of organizations in CO", "Passive participation", "Preliminary social investigation", "CSR program design"], "a": 0, "e": ""}, {"q": "A PO starts a livelihood project before members practice decision-making, causing factionalism. Which lesson applies?", "o": ["Microenterprise should always be the first organizing entry point", "The same leaders should manage both PO and enterprise", "Political agenda should be replaced by enterprise goals", "Economic projects should follow institutionalized group processes and strengthen the PO agenda"], "a": 3, "e": ""}, {"q": "A network partner expects to dominate the alliance because it provides funds. Which networking principle is at risk?", "o": ["Passive participation", "Functional participation", "Partnership of equals and respect for autonomy", "Phase-out preparation"], "a": 2, "e": ""}, {"q": "A campaign uses popular education sessions, public fora, radio guesting, and publications after issue analysis. This is:", "o": ["Area selection", "Advocacy campaign", "Community integration", "Core group building only"], "a": 1, "e": ""}, {"q": "A social worker conducts participatory research and trains residents to collect and interpret data about their own conditions. The CO role is:", "o": ["Researcher", "Catalyst only", "Facilitator only", "Broker only"], "a": 0, "e": ""}, {"q": "The organizer challenges traditions that silence women because they run counter to people’s interests. This quality is:", "o": ["Tenacity", "Acculturation only", "Sense of humor", "Irreverence"], "a": 3, "e": ""}, {"q": "The organizer adapts meetings after discovering women cannot attend due to unpaid care work. This demonstrates:", "o": ["Commercial relationship", "External expert control", "Flexibility and gender sensitivity", "Passive participation"], "a": 2, "e": ""}, {"q": "A community organizer learns local language and daily customs before facilitating action. This demonstrates:", "o": ["Case recording", "Ability to acculturate", "Legislative advocacy", "Social planning only"], "a": 1, "e": ""}, {"q": "A barangay development council is helped to gather baseline data, analyze it, and prepare an integrated development plan. This is:", "o": ["Baranganic approach", "Alinsky conflict confrontation only", "Women and Development only", "Passive participation"], "a": 0, "e": ""}, {"q": "A project team asks the community to map hazards, vulnerable households, coping mechanisms, and resources. The tool is:", "o": ["Genogram", "Case recording", "Policy advocacy", "Community risk, damage, and assessment"], "a": 3, "e": ""}, {"q": "A PO wants to understand why women rarely speak in meetings despite being active in projects. The most useful tool is:", "o": ["Stakeholder analysis only", "Problem tree only", "Gender analysis", "Force field analysis only"], "a": 2, "e": ""}, {"q": "A group wants to understand driving and restraining forces affecting a waste management campaign. The tool is:", "o": ["Gender Analysis only", "Force Field Analysis", "Participatory Training", "Writeshop"], "a": 1, "e": ""}, {"q": "A community wants to identify key actors, interests, and involvement concerning a proposed evacuation center. The tool is:", "o": ["Stakeholder Analysis", "Class Analysis", "Appreciative Planning and Action only", "Participation by consultation"], "a": 0, "e": ""}, {"q": "A group wants to analyze root causes and effects of child labor in their community. The tool is:", "o": ["SWOT Analysis only", "Writeshop", "Self-mobilization", "Problem Tree"], "a": 3, "e": ""}, {"q": "A PO chooses to document success stories and imagine future strengths rather than begin with deficits. This follows:", "o": ["Participation by material incentives", "Passive participation", "Appreciative Inquiry or Appreciative Planning and Action", "Conflict confrontation only"], "a": 2, "e": ""}]; const quiz=document.getElementById('quiz'); const toc=document.getElementById('toc'); const letter=i=>['A','B','C','D'][i];
function isSituational(q){return /community|organizer|worker|residents|people|barangay|organization|group|PO|campaign|project|women|leaders|members|council|fisherfolk/i.test(q.q)}
questions.forEach((item,i)=>{if(i%20===0){const a=document.createElement('a');a.href='#q'+(i+1);a.textContent=`Questions ${i+1}-${Math.min(i+20,questions.length)}`;toc.appendChild(a);}const card=document.createElement('article');card.className='qcard';card.id='q'+(i+1);const tag=document.createElement('div');tag.className='tag';tag.textContent=isSituational(item)?'Situational / Application':'Conceptual / Recall';card.appendChild(tag);const title=document.createElement('div');title.className='qtitle';title.textContent=`${i+1}. ${item.q}`;card.appendChild(title);const opts=document.createElement('div');opts.className='options';item.o.forEach((opt,j)=>{const lab=document.createElement('label');lab.className='option';lab.dataset.q=i;lab.dataset.o=j;lab.innerHTML=`<input type="radio" name="q${i}" value="${j}"> <span><strong>${letter(j)}.</strong> ${opt}</span>`;opts.appendChild(lab);});card.appendChild(opts);const ans=document.createElement('div');ans.className='answer';ans.id='ans'+i;ans.textContent=`Correct answer: ${letter(item.a)}. ${item.o[item.a]}`;card.appendChild(ans);if(item.e){const ex=document.createElement('div');ex.className='explain';ex.id='exp'+i;ex.textContent='Explanation: '+item.e;card.appendChild(ex);}quiz.appendChild(card);});
function submitQuiz(){let score=0,answered=0;document.querySelectorAll('label.option').forEach(l=>l.classList.remove('correct','wrong'));questions.forEach((item,i)=>{const selected=document.querySelector(`input[name="q${i}"]:checked`);const labels=document.querySelectorAll(`label[data-q="${i}"]`);labels[item.a].classList.add('correct');if(selected){answered++;const val=Number(selected.value);if(val===item.a)score++;else labels[val].classList.add('wrong');}document.getElementById('ans'+i).classList.add('show');const ex=document.getElementById('exp'+i);if(ex)ex.classList.add('show');});const pct=((score/questions.length)*100).toFixed(2);document.getElementById('scoreBox').innerHTML=`<strong>Score: ${score} / ${questions.length} (${pct}%)</strong><br>Answered: ${answered} / ${questions.length}`;window.scrollTo({top:0,behavior:'smooth'});}
function showAnswers(){document.querySelectorAll('label.option').forEach(l=>l.classList.remove('correct','wrong'));questions.forEach((item,i)=>{document.querySelectorAll(`label[data-q="${i}"]`)[item.a].classList.add('correct');document.getElementById('ans'+i).classList.add('show');const ex=document.getElementById('exp'+i);if(ex)ex.classList.add('show');});}
function resetQuiz(){document.querySelectorAll('input[type="radio"]').forEach(r=>r.checked=false);document.querySelectorAll('label.option').forEach(l=>l.classList.remove('correct','wrong'));document.querySelectorAll('.answer,.explain').forEach(a=>a.classList.remove('show'));document.getElementById('scoreBox').textContent='Score: Not submitted yet.';window.scrollTo({top:0,behavior:'smooth'});}

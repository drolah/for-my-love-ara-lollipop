<script>
const items=[{"seq": 1, "source_no": "1", "main_question": "Cite which from the following enumerations relates to the sequential development of social welfare in the Philippines is LEAST CORRECT?", "details": "I. That the SWC and PACSA were merged into the Social Welfare Administration that marks the beginning of an integrated public welfare program.\n\nII. That it was in 1987 when MSSD was reorganized under the first Aquino administration and that, by the virtue of Executive Order 123 that established the functional areas of responsibility of DSWD and further defined its statutory responsibility.\n\nIII. It was by the virtue of RA 5416 that created the Social Welfare Act of the Philippines, and so was the basis for all following amendments of this act until the present and for what is known now as the Department of Social Welfare and Development.\n\nIV. That it was premised from the 1972 constitution when former President Ferdinand Marcos renamed DSSD to MSSD to adapt to the change of government from presidential to parliamentary in those times.", "options": [{"letter": "A", "label": "a. I and II", "value": "A"}, {"letter": "B", "label": "b. none from the statements", "value": "B"}, {"letter": "C", "label": "c. II, III and IV", "value": "C"}, {"letter": "D", "label": "d. III and IV", "value": "D"}, {"letter": "E", "label": "e. all of the above", "value": "E"}], "answer": "D", "answers": ["D"], "note": "III and IV", "scored": true}, {"seq": 2, "source_no": "2", "main_question": "These are the byproducts of the intersections of the profession’s philosophies, assumptions, value- driven principles, and the core values of the profession. Choose the among the statements the BEST answer/s.", "details": "I. Social Work theories and knowledge\n\nII. Social Work theory-informed practice and practice-informed theory\n\nIII. Social Work Code of Ethics\n\nIV. Ethical Standards for Social Workers\n\nV. Social Work philosophies, values, and professional culture", "options": [{"letter": "A", "label": "a. I and II", "value": "A"}, {"letter": "B", "label": "b. III and IV", "value": "B"}, {"letter": "C", "label": "c. II and III", "value": "C"}, {"letter": "D", "label": "d. IV and IV", "value": "D"}, {"letter": "E", "label": "e. III and V", "value": "E"}], "answer": "B", "answers": ["B"], "note": "III and IV", "scored": true}, {"seq": 3, "source_no": "3", "main_question": "These are concerns or issues about the quality of life for large groups of people where the concern is held as a consensus population-wide.", "details": "", "options": [{"letter": "A", "label": "a. issues and problems", "value": "A"}, {"letter": "B", "label": "b. social phenomenon", "value": "B"}, {"letter": "C", "label": "c. social problems", "value": "C"}, {"letter": "D", "label": "d. problems", "value": "D"}, {"letter": "E", "label": "e. societal defects", "value": "E"}, {"letter": "F", "label": "f. A and B", "value": "F"}], "answer": "C", "answers": ["C"], "note": "social problems", "scored": true}, {"seq": 4, "source_no": "4", "main_question": "Understanding a social problem is not quite the same thing as understanding the truth of how things exist. The use of social problem analysis is to understand how and what another person or group thinks and believes about the social events being defined as a problem. Identify the LEAST goal of a particular social problem analysis from among the statements below.", "details": "a. To discover the antecedents (causes) of the problem and its consequences (effects), or both that are of utmost importance to the particular social problem;\n\nb. To determine the possible outcomes of the complexities of the problems;\n\nc. To provide effective and efficient services taken from the welfare program services\n\nd. To understand the pros (advantages) and cons (disadvantages) of problem definition, contributing to a successful intervention.", "options": [{"letter": "A", "label": "a. A and B", "value": "A"}, {"letter": "B", "label": "b. B and C", "value": "B"}, {"letter": "C", "label": "c. A only", "value": "C"}, {"letter": "D", "label": "d. C and D", "value": "D"}, {"letter": "E", "label": "e. Except A", "value": "E"}], "answer": "B", "answers": ["B"], "note": "B and C", "scored": true}, {"seq": 5, "source_no": "5", "main_question": "Distinguish goals from objectives.", "details": "", "options": [{"letter": "A", "label": "a. An objective is an abstract and general statement of desired outcomes while a goal is a concrete operational statement about a desired observable outcome;", "value": "A"}, {"letter": "B", "label": "b. A goal is an abstract and general statement of desired outcomes while an objective is a concrete operational statement about a desired observable outcome;", "value": "B"}, {"letter": "C", "label": "c. An objective is usually long-term and lasting while a goal is short-term and guiding;", "value": "C"}, {"letter": "D", "label": "d. A goal is usually long-term and lasting while an objective is short-term and guiding;", "value": "D"}], "answer": "B", "answers": ["B"], "note": "Goal is abstract/general; objective is concrete/operational", "scored": true}, {"seq": 6, "source_no": "5", "main_question": "In its most fundamental sense, the goal of a social policy is to provide a solution to a social problem that is primarily lodge to the work of the legislators. Following its passage, such law (social policy) is handed over to the executive branch for the purposes of?", "details": "", "options": [{"letter": "A", "label": "a. Providing means by which the social policy can be implemented;", "value": "A"}, {"letter": "B", "label": "b. Providing means by which the policy is interpreted whether contrary to the Constitution or otherwise;", "value": "B"}, {"letter": "C", "label": "c. Providing means to challenge the legitimacy of the law;", "value": "C"}, {"letter": "D", "label": "d. Providing means by which the Congress and the Judiciary jointly implement the policy passed by the Congress.", "value": "D"}], "answer": "A", "answers": ["A"], "note": "Executive branch implements policy", "scored": true}, {"seq": 7, "source_no": "6", "main_question": "It is without argument that Social Work practice is a helping process intended to alleviate the ability of people to accomplish life tasks, alleviate distress, and realize individual and collective aspirations. In a general sense, social workers guide a change process that accomplishes a single or more purpose of the profession. Choose which is the LEAST purpose of the profession.", "details": "I. Enhance the problem-solving and coping capacities of people;\n\nII. Prevent the development of serious personal and social problems;\n\nIII. Restore and maintain the social functioning of people;\n\nIV. Link people with those systems and resources that can provide needed support, services, and opportunities;\n\nV. Promote the creation and development of humane and effective social policy and human service programs;\n\nVI. Plan, develop, and administer social agencies and social programs", "options": [{"letter": "A", "label": "a. I, IV and V", "value": "A"}, {"letter": "B", "label": "b. II, III, IV and VI", "value": "B"}, {"letter": "C", "label": "c. None from statements", "value": "C"}, {"letter": "D", "label": "d. None except F", "value": "D"}, {"letter": "E", "label": "e. All including D", "value": "E"}, {"letter": "F", "label": "f. All of the statements", "value": "F"}, {"letter": "G", "label": "g. C only", "value": "G"}, {"letter": "H", "label": "h. F only", "value": "H"}], "answer": "C", "answers": ["C"], "note": "None from statements; all listed are purposes of the profession", "scored": true}, {"seq": 8, "source_no": "6", "main_question": "Reflecting from the beginning history of social welfare, it is well-settled that the prototype of the modern community is called community chest. What was the contention of Martin Luther about community chest?", "details": "", "options": [{"letter": "A", "label": "a. Community chest should have an administrative, legislative and ministerial functions", "value": "A"}, {"letter": "B", "label": "b. That community chest should be given freely for those who are in dire needs", "value": "B"}, {"letter": "C", "label": "c. There should be a common chest for the receipt of food, money, and clothing to assist the needy.", "value": "C"}, {"letter": "D", "label": "d. The community has the responsibility to secure treatment and alms giving for those who depend on charity works run by daughters of charity.", "value": "D"}], "answer": "C", "answers": ["C"], "note": "Common chest for food, money, and clothing", "scored": true}, {"seq": 9, "source_no": "8", "main_question": "The following are salient features of Elizabethan Poor Law of 1601, which one is (a) BEST feature?", "details": "I. Primary responsibility for the care of the poor belonged to the individual’s family and relatives\n\nII. Those who could not be supported by relatives had to be cared for by the parish or local community\n\nIII. Only the poor who were bonafide residents of the parish were eligible for assistance\n\nIV. The parish must maintain the impotent poor from voluntary contributions of the parishioners through collections.\n\nV. A general tax was levied to provide the poor tax and was the main source for financing of poor relief", "options": [{"letter": "A", "label": "a. None of the above statements are incorrect as it adequately features the salient points of the law", "value": "A"}, {"letter": "B", "label": "b. Half of the above statements are salient features of the law", "value": "B"}, {"letter": "C", "label": "c. None of the above statements least featured salient points of the law", "value": "C"}, {"letter": "D", "label": "d. None of the above statements adequately featured the salient points of the law", "value": "D"}], "answer": "A", "answers": ["A"], "note": "All statements are features of Elizabethan Poor Law", "scored": true}, {"seq": 10, "source_no": "8", "main_question": "What is the prototype of modern-day community center?", "details": "", "options": [{"letter": "A", "label": "a. DSWD", "value": "A"}, {"letter": "B", "label": "b. settlement house", "value": "B"}, {"letter": "C", "label": "c. charity organization society", "value": "C"}, {"letter": "D", "label": "d. associated charities", "value": "D"}], "answer": "B", "answers": ["B"], "note": "Settlement house", "scored": true}, {"seq": 11, "source_no": "9", "main_question": "The American occupation of the Philippines placed social welfare under the auspices of the?", "details": "", "options": [{"letter": "A", "label": "a. government", "value": "A"}, {"letter": "B", "label": "b. religious sector", "value": "B"}, {"letter": "C", "label": "c. private sector and civic-spirited group", "value": "C"}, {"letter": "D", "label": "d. philanthropist", "value": "D"}, {"letter": "E", "label": "e. private donors", "value": "E"}], "answer": "C", "answers": ["C"], "note": "Private sector and civic-spirited group", "scored": true}, {"seq": 12, "source_no": "10", "main_question": "The Philippines Association of Social Workers, which is a professional organization, was founded in 1947 while social work was elevated to the status of a profession by RA 4373 in?", "details": "", "options": [{"letter": "A", "label": "a. 1970", "value": "A"}, {"letter": "B", "label": "b. 1969", "value": "B"}, {"letter": "C", "label": "c. 1967", "value": "C"}, {"letter": "D", "label": "d. 1965", "value": "D"}, {"letter": "E", "label": "e. 1961", "value": "E"}], "answer": "D", "answers": ["D"], "note": "1965", "scored": true}, {"seq": 13, "source_no": "11", "main_question": "This is the comprehensive and continues strengthening in its alignment with international standards and towards universal coverage of social services in the Philippines?", "details": "", "options": [{"letter": "A", "label": "a. social welfare", "value": "A"}, {"letter": "B", "label": "b. social services", "value": "B"}, {"letter": "C", "label": "c. social protection", "value": "C"}, {"letter": "D", "label": "d. social work", "value": "D"}], "answer": "C", "answers": ["C"], "note": "Social protection", "scored": true}, {"seq": 14, "source_no": "12", "main_question": "Victim-survivors of natural and man-made disasters, displaced families, people in squatters, evacuees, and rebel returnees etc. are some of the clients catered by?", "details": "", "options": [{"letter": "A", "label": "a. Rehabilitation of individuals, families, groups and communities", "value": "A"}, {"letter": "B", "label": "b. People in severely distressed situations", "value": "B"}, {"letter": "C", "label": "c. Restoration of social work clients in crisis intervention", "value": "C"}, {"letter": "D", "label": "d. Rehabilitation of individuals and families of immediate assistance", "value": "D"}, {"letter": "E", "label": "e. None of the choices", "value": "E"}], "answer": "B", "answers": ["B"], "note": "People in severely distressed situations", "scored": true}, {"seq": 15, "source_no": "13", "main_question": "Self-employment assistance program, food yielding, housing assistance on a loan basis, is in what phase under Rehabilitation of Individuals/Families/Groups/Communities in crisis situation?", "details": "", "options": [{"letter": "A", "label": "a. emergency phases", "value": "A"}, {"letter": "B", "label": "b. restoration phase", "value": "B"}, {"letter": "C", "label": "c. rehabilitation phase", "value": "C"}, {"letter": "D", "label": "d. preventive phase", "value": "D"}], "answer": "C", "answers": ["C"], "note": "Rehabilitation phase", "scored": true}, {"seq": 16, "source_no": "14", "main_question": "In all of the major components of the Philippines government’s social protection programs, choose which is BEST concerned with programs that provide direct support to those in need, including cash grants and other forms of aid.", "details": "I. social insurance\n\nII. social welfare\n\nIII. labor market\n\nIV. safety nets\n\nV. social services", "options": [{"letter": "A", "label": "a. except I", "value": "A"}, {"letter": "B", "label": "b. III and V only", "value": "B"}, {"letter": "C", "label": "c. II only", "value": "C"}, {"letter": "D", "label": "d. except III", "value": "D"}, {"letter": "E", "label": "e. Only V", "value": "E"}], "answer": "C", "answers": ["C"], "note": "Social welfare", "scored": true}, {"seq": 17, "source_no": "15", "main_question": "The following are factors that affect the nature of making and updating of the policy, which is NOT included?", "details": "I. needs and resources\n\nII. political events/development\n\nIII. values, knowledge and power\n\nIV. pressing societal issues\n\nV. presence of POGOS controlled by Chinese nationals", "options": [{"letter": "A", "label": "a. I only", "value": "A"}, {"letter": "B", "label": "b. II only", "value": "B"}, {"letter": "C", "label": "c. III only", "value": "C"}, {"letter": "D", "label": "d. IV only", "value": "D"}, {"letter": "E", "label": "e. All", "value": "E"}], "answer": "E", "answers": ["E"], "note": "Forced answer based on closest available choice in source; source appears to omit V only.", "scored": true}, {"seq": 18, "source_no": "16", "main_question": "Identify who are the LEAST agents of law-making-process in the Philippines?", "details": "I. Members of the Senate\n\nII. Members of the House of Representatives\n\nIII. Members of Congress\n\nIV. Members of the Legislative Branch of the Government", "options": [{"letter": "A", "label": "a. I and II only", "value": "A"}, {"letter": "B", "label": "b. III only", "value": "B"}, {"letter": "C", "label": "c. all", "value": "C"}, {"letter": "D", "label": "d. II and IV only", "value": "D"}, {"letter": "E", "label": "e. none", "value": "E"}], "answer": "E", "answers": ["E"], "note": "None; I, II, III, IV are all law-making agents", "scored": true}, {"seq": 19, "source_no": "17", "main_question": "For a bill to become a law in the Philippines, which in the hereunder statements outlined in the constitution BEST concludes the process?", "details": "I. When the President signs it without reservations\n\nII. When the Congress overrides the vetoed bill by the President\n\nIII. When the Supreme Court declares the newly passed law to be unconstitutional and inconsistent with some of the provisions of the law.\n\nIV. When the President vetoes the bill and returns it from the house of origin\n\nV. When the Congress, acting as judiciary, thumbs down the bill/s it initiated due to political divisions.", "options": [{"letter": "A", "label": "a. I, II and V", "value": "A"}, {"letter": "B", "label": "b. except I and III", "value": "B"}, {"letter": "C", "label": "c. I,II and III", "value": "C"}, {"letter": "D", "label": "d. except II and IV", "value": "D"}, {"letter": "E", "label": "e. none", "value": "E"}], "answer": "E", "answers": ["E"], "note": "None; correct statements are I and II only, but no choice matches", "scored": true}, {"seq": 20, "source_no": "18", "main_question": "What is the latest legislation passed by the Philippine Congress which shall provide for and allow simpler inexpensive local adoption proceedings, now primarily administrative, and shall streamline services for alternative child placement services.", "details": "", "options": [{"letter": "A", "label": "a. RA 11624, repealing RA 8525, which previously requires court-hearing proceedings for adoption cases pending trial", "value": "A"}, {"letter": "B", "label": "b. RA 11462, repealing RA 8552, which now provides a faster process, more accessible, and less costly for prospective adoptive parents and ensures best interest of the fostered child.", "value": "B"}, {"letter": "C", "label": "c. RA 11642, repealing RA 8552, which previously required court proceedings for adoption.", "value": "C"}, {"letter": "D", "label": "d. RA 11642, repealing RA 8525, which previously streamlines child caring services for adoption proceedings administratively.", "value": "D"}, {"letter": "E", "label": "e. None from th ": ["E"], "note": "Only V is least influential", "scored": true}, {"seq": 23, "source_no": "21", "main_question": "Identify the BEST elements of participatory development in social work?", "details": "I. Its process implies that it must be on-going\n\nII. Inclusiveness means all groups and individuals affected by the problem should be involved in planning providing solutions.\n\nIII. Development and designing of activities should be directed towards them.\n\nIV. The responsibility of implementation of a solution lies with the participants", "options": [{"letter": "A", "label": "a. Mostly are applicable", "value": "A"}, {"letter": "B", "label": "b. All", "value": "B"}, {"letter": "C", "label": "c. None are inapplicable", "value": "C"}, {"letter": "D", "label": "d. II, III and IV only", "value": "D"}, {"letter": "E", "label": "e. B only", "value": "E"}], "answer": "B", "answers": ["B"], "note": "All statements are applicable; source has duplicate concept in choices", "scored": true, "details_html": ""}, {"seq": 24, "source_no": "22", "main_question": "The determination and enacting Of laws that capsulated the rights of women in societies is a manifestation that the Philippines is mainstreaming gender in our system. When there are variety of methods used to stress the relationships between men and women, their access to resources, their activities, and the constraints they face relative to each other, what is evident in the system?", "details": "", "options": [{"letter": "A", "label": "a. Appreciating gender and sex", "value": "A"}, {"letter": "B", "label": "b. Women and girl’s empowerment", "value": "B"}, {"letter": "C", "label": "c. Controlled-emotional feelings of women", "value": "C"}, {"letter": "D", "label": "d. Women’s integration to social norms", "value": "D"}], "answer": "A", "answers": ["A"], "note": "Appreciating gender and sex / gender analysis concept", "scored": true}, {"seq": 25, "source_no": "23", "main_question": "The hereunder are some of the fields abel": "b. Stairs with supportive handguides", "value": "B"}, {"letter": "C", "label": "c. Wheelchair ramps", "value": "C"}, {"letter": "D", "label": "d. Modern backdoor pathways and terrains that aren’t slippery", "value": "D"}, {"letter": "E", "label": "e. escalators", "value": "E"}], "answer": "E", "answers": ["E"], "note": "Escalators", "scored": true}, {"seq": 43, "source_no": "39", "main_question": "Which of the following intervention is BEST as a primary response to traumatic events like war and striking of natural disasters, and the like?", "details": "I. Identification of immediate felt needs\n\nII. Expressing empathetic gestures to allow survivors feel secured and away from further harm\n\nIII. Disbursing goods and services that can help the\n\nIV. Provision of food materials that can relieve hunger", "options": [{"letter": "A", "label": "a. I and IV", "value": "A"}, {"letter": "B", "label": "b. III only", "value": "B"}, {"letter": "C", "label": "c. II and III", "value": "C"}, {"letter": "D", "label": "d. all except b", "value": "D"}, {"letter": "E", "label": "e. none", "value": "E"}, {"letter": "F", "label": "f. all", "value": "F"}], "answer": "F", "answers": ["F"], "note": "All", "scored": true}, {"seq": 44, "source_no": "40", "main_question": "This facilitate the inclusion of individuals and groups in the design of policies via participatory means to achieve accountability and transparency.", "details": "", "options": [{"letter": "A", "label": "a. participatory research", "value": "A"}, {"letter": "B", "label": "b. participatory policy-making", "value": "B"}, {"letter": "C", "label": "c. participatory action research", "value": "C"}, {"letter": "D", "label": "d. generalist approach", "value": "D"}, {"letter": "E", "label": "e. holism", "value": "E"}, {"letter": "F", "label": "f. participation of clients", "value": "F"}], "answer": "B", "answers": ["B"], "note": "Participatory policy-making", "scored": true}, {"seq": 45, "source_no": "41", "main_question": "Any acts or omissions that are gender-based distinction, exclusion or restriction which has the effect or purpose of impairing or nullifying the recognition, enjoyment, or exercises by women, irrespective of their marital status, on a basis of equality of men and women, of human rights, and fundamental freedoms in the political, economic, social, cultural, civil, or any other field.", "details": "", "options": [{"letter": "A", "label": "a. Discrimination", "value": "A"}, {"letter": "B", "label": "b. Stereotypes", "value": "B"}, {"letter": "C", "label": "c. Negative Shaming", "value": "C"}, {"letter": "D", "label": "d. Criminal Acts", "value": "D"}], "answer": "A", "answers": ["A"], "note": "Discrimination", "scored": true, "details_html": ""}, {"seq": 46, "source_no": "42", "main_question": "The following except the obvious ONE are salient features of Special Protection of Children Against Abuse, Exploitation and Discrimination Act or RA 7610. Identify.", "details": "I. Section 4. Formulation of the Program. – There shall be a comprehensive program to be formulated, by the Department of Justice and the Department of Social Welfare and Development in coordination with other government agencies and private sector concerned, within one (1) year from the effectivity of this Act, to protect children against child prostitution and other sexual abuse; child trafficking, obscene publications and indecent shows; other acts of abuse; and circumstances which endanger child survival and normal development.\n\nII. Section 22. Children as Zones of Peace. – Children are hereby declared as Zones of Peace. It shall be the responsibility of the State and all other sectors concerned to resolve armed conflicts in order to promote the goal of children as zones of peace.\n\nIII. Section 23. Evacuation of Children During Armed Conflict. – Children shall be given priority during evacuation as a result of armed conflict. Existing community organizations shall be tapped to look after the safety and well-being of children during evacuation operations. Measures shall be taken to ensure that children evacuated are accompanied by persons responsible for their safety and well-being.\n\nIV. Section 27. Who May File a Complaint. – Complaints on cases of unlawful acts committed against the children as enumerated herein may be filed by the following: (a) Offended party; (b) Parents or guardians; (c) Ascendant or collateral relative within the third degree of consanguinity; (d) Officer, social worker or representative of a licensed child- caring institution; (e) Officer or social worker of the Department of Social Welfare and Development; (f) Barangay chairman; or (g) At least three (3) concerned responsible citizens where the violation occurred.\n\nV. Section 28. Protective Custody of the Child. – The offended party shall be immediately placed under the protective custody of the Department of Social Welfare and Development pursuant to Executive Order No. 56, series of 1986. In the regular performance of this function, the officer of the Department of Social Welfare and Development shall be free from any administrative, civil or criminal liability. Custody proceedings shall be in accordance with the provisions of Presidential Decree No. 603.", "options": [{"letter": "A", "label": "a. ALL statements are correct", "value": "A"}, {"letter": "B", "label": "b. III only", "value": "B"}, {"letter": "C", "label": "c. IV and V", "value": "C"}, {"letter": "D", "label": "d. NONE", "value": "D"}, {"letter": "E", "label": "e. A and D", "value": "E"}], "answer": "A", "answers": ["A"], "note": "All statements correct", "scored": true}, {"seq": 47, "source_no": "44", "main_question": "This is the government's national strategy for achieving peace and development in conflict-affected areas and vulnerable communities. Launched in 2011, it provides basic services, improves governance, addresses the root causes of conflict, and empowers communities by bringing back government s d Holistic Framework for Assault and Sexual Harassment Cases\n\nBy providing mechanisms to prevent crimes against humanity, the law aims to strengthen anti-rape law or the RA 8353.", "options": [{"letter": "A", "label": "a. I only", "value": "A"}, {"letter": "B", "label": "b. II only", "value": "B"}, {"letter": "C", "label": "c. III only", "value": "C"}, {"letter": "D", "label": "d. IV only", "value": "D"}, {"letter": "E", "label": "e. None", "value": "E"}], "answer": "D", "answers": ["D"], "note": "IV only", "scored": true}, {"seq": 54, "source_no": "51", "main_question": "This type of research is a form of action research that is committed to the involvement of those who are most affected. It challenges the traditional power imbalance between the researcher as ‘expert’ and research participant as ‘passive subject’ and is highly compatible with anti-discriminatory and anti-oppressive practice.", "details": "", "options": [{"letter": "A", "label": "a. Participatory Action Research", "value": "A"}, {"letter": "B", "label": "b. Participatory Rapid Appraisal", "value": "B"}, {"letter": "C", "label": "c. Participatory Community Research", "value": "C"}, {"letter": "D", "label": "d. Participatory Research Design", "value": "D"}], "answer": "A", "answers": ["A"], "note": "Participatory Action Research", "scored": true}, {"seq": 55, "source_no": "52", "main_question": "The following are two common examples of research instruments. Which is BEST included?", "details": "I. Interviews\n\nII. Questionnaires\n\nIII. Online Surveys\n\nIV. Participant Observation", "options": [{"letter": "A", "label": "a. All", "value": "A"}, {"letter": "B", "label": "b. None", "value": "B"}, {"letter": "C", "label": "c. I and II", "value": "C"}, {"letter": "D", "label": "d. All except A", "value": "D"}, {"letter": "E", "label": "e. None Except C", "value": "E"}], "answer": "C", "answers": ["C"], "note": "I and II", "scored": true}, {"seq": 56, "source_no": "53", "main_question": "An interview in qualitative research is the actual collection of data by asking questions to the selected participants. It includes three main types: Structured, Unstructured, and Semi-Structured Interviews. Choose which of the hereunder BEST describes these types of interviews?", "details": "I. Structured interviews include an ordered list of questions. These questions are often closed-ended and draw a yes, no or a short answer from the respondents. Structured interviews are easy to execute but leave little room for spontaneity.\n\nII. Unstructured interviews are the opposite of structured interviews. Questions are mostly open-ended and are not arranged in order. The participants can express themselves more freely and elaborate on their answers.\n\nIII. Semi-structured interviews are a blend of structured and unstructured interviews. They are more organized than unstructured interviews, though not as rigid as structured interviews.\n\nIV. Semi-formal interviews are blended with formal and informal interviews that captures the best subjective experiences of people to a phenomenon.", "options": [{"letter": "A", "label": "a. I, II and IV", "value": "A"}, {"letter": "B", "label": "b. I, III and IV", "value": "B"}, {"letter": "C", "label": "c. I, II and III", "value": "C"}, {"letter": "D", "label": "d. II, III and IV", "value": "D"}], "answer": "C", "answers": ["C"], "note": "I, II and III", "scored": true}, {"seq": 57, "source_no": "54", "main_question": "The following are objectives of tabulation in research, which is not a good objective?", "details": "I. To simplify complex data- It reduces the bulk of information, i.e., it reduces raw data in a simplified and meaningful form so that it can be easily interpreted by a common man in less time.\n\nII. To bring out essential features of data- It brings out the chief/main characteristics of data. It presents facts clearly and precisely without textual explanation.\n\nIII. To facilitate comparison- The representation of data in rows and columns is helpful in simultaneous detailed comparison on the basis of several parameters.\n\nIV. To facilitate statistical analysis- Tables serve as the best source of organized data for statistical analysis. The task of computing average, dispersion, correlation, etc., becomes easier if data is presented in the form of a table.\n\nV. To save space- A table presents facts in a better way than the textual form. It saves space without sacrificing the quality and quantity of data.", "options": [{"letter": "A", "label": "a. II only", "value": "A"}, {"letter": "B", "label": "b. III and IV", "value": "B"}, {"letter": "C", "label": "c. V only", "value": "C"}, {"letter": "D", "label": "d. None", "value": "D"}, {"letter": "E", "label": "e. Except I", "value": "E"}], "answer": "D", "answers": ["D"], "note": "None", "scored": true}, {"seq": 58, "source_no": "55", "main_question": "In the field of research, statistics is important for the following reasons. Which is BEST?", "details": "I. Statistics allows researchers to design studies such that the findings from the studies can be extrapolated to a larger population.\n\nII. Statistics allows researchers to perform hypothesis tests to determine if some claim about\n\na new drug, new procedure, new manufacturing method, etc. is true.\n\nIII. Statistics allows researchers to create confidence intervals to capture uncertainty around population estimates.\n\nIV. Statistical results can generalize to a conclusion due to its larger number of participants.", "options": [{"letter": "A", "label": "a. ALL", "value": "A"}, {"letter": "B", "label": "b. NONE", "value": "B"}, {"letter": "C", "label": "c. II, III and IV only", "value": "C"}, {"letter": "D", "label": "d. I, II and III", "value": "D"}, {"letter": "E", "label": "e. IV", "value": "E"}], "answer": "D", "answers": ["D"], "note": "I, II and III", "scored": true}, {"seq": 59, "source_no": "56", "main_question": "The following are types of inferential statistics, which ONE is not included?", "details": "I. Regression Analysis\n\nII. Z test\n\nIII. F test\n\nIV. T test\n\nV. Confidence Interval", "options": [{"letter": "A", "label": "a. None", "value": "A"}, {"letter": "B", "label": "b. II, III and IV", "value": "B"}, {"letter": "C", "label": "c. All", "value": "C"}, {"letter": "D", "label": "d. I only", "value": "D"}, {"letter": "E", "label": "e. I and V", "value": "E"}], "answer": "A", "answers": ["A"], "note": "None; all listed are inferential statistics", "scored": true}, {"seq": 60, "source_no": "57", "main_question": "This is an analysis tool used in statistics that splits an observed aggregate variability found inside a data set into two parts: systematic factors and random factors. The systematic factors have a statistical influence on the given data set, while the random factors do not. Analysts use this test to determine the influence that independent variables have on the dependent variable in a regression study", "details": "", "options": [{"letter": "A", "label": "a. Parabola", "value": "A"}, {"letter": "B", "label": "b. Chi squared test", "value": "B"}, {"letter": "C", "label": "c. T-test", "value": "C"}, {"letter": "D", "label": "d. ANOVA", "value": "D"}], "answer": "D", "answers": ["D"], "note": "ANOVA", "scored": true}, {"seq": 61, "source_no": "58", "main_question": "This is a correlation coefficient that measures linear correlation between two sets of data. It is the ratio between the covariance of two variables and the product of their standard deviations; thus, it is essentially a normalized measurement of the covariance, such that the result always has a value between −1 and 1. As with covariance itself, the measure can only reflect a linear correlation of variables, and ignores many other types of relationships or correlations. As a simple example, one would expect the age and height of a sample of teenagers from a high school to have a Pearson correlation coefficient significantly greater than 0, but less than 1 (as 1 would represent an unrealistically perfect correlation).", "details": "", "options": [{"letter": "A", "label": "a. Chi Square", "value": "A"}, {"letter": "B", "label": "b. Pearson r", "value": "B"}, {"letter": "C", "label": "c. ANOVA", "value": "C"}, {"letter": "D", "label": "d. Parabola", "value": "D"}, {"letter": "E", "label": "e. T-test", "value": "E"}], "answer": "B", "answers": ["B"], "note": "Pearson r", "scored": true, "details_html": ""}, {"seq": 62, "source_no": "59", "main_question": "A bell-shaped and symmetrical theoretical distribution, with the mean, the median, and the mode all coinciding at its peak and with frequencies gradually decreasing at both ends of the curve.", "details": "", "options": [{"letter": "A", "label": "a. Normal distribution", "value": "A"}, {"letter": "B", "label": "b. Irregular distribution", "value": "B"}, {"letter": "C", "label": "c. Skewed distribution", "value": "C"}, {"letter": "D", "label": "d. None of the above", "value": "D"}], "answer": "A", "answers": ["A"], "note": "Normal distribution", "scored": true}, {"seq": 63, "source_no": "60", "main_question": "When scores of two variables move together in the same direction, there is?", "details": "", "options": [{"letter": "A", "label": "a. Negative correlation", "value": "A"}, {"letter": "B", "label": "b. Equal correlation", "value": "B"}, {"letter": "C", "label": "c. Positive correlation", "value": "C"}, {"letter": "D", "label": "d. No correlation", "value": "D"}], "answer": "C", "answers": ["C"], "note": "Positive correlation", "scored": true}, {"seq": 64, "source_no": "61", "main_question": "Of the following statements, which one is LEAST included as purpose for establishing the Council of Welfare Agencies and the Community Chest of Greater Manila?", "details": "I. Study and define social welfare problems and human needs\n\nII. Develop a coordinated plan of action to meet these needs\n\nIII. Help improve the standards of social services\n\nIV. Serve as the national Committe

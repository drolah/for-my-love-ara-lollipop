<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Work Questionnaire</title>
    <style>
        :root {
            --primary: #8b1e3f;
            --primary2: #c2410c;
            --bg: #fff7ed;
            --card: #fff;
            --text: #1f2328;
            --muted: #57606a;
            --ok: #1a7f37;
            --bad: #cf222e;
            --line: #d0d7de
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.55
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: white;
            padding: 28px 18px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .18)
        }

        header h1 {
            margin: 0 0 6px;
            font-size: clamp(1.35rem, 3vw, 2.35rem)
        }

        header p {
            margin: 0;
            opacity: .96
        }

        .wrap {
            max-width: 1080px;
            margin: 22px auto;
            padding: 0 16px 90px
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04)
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            margin: 3px
        }

        .primary {
            background: var(--primary);
            color: white
        }

        .secondary {
            background: #eaeef2;
            color: #24292f
        }

        .danger {
            background: #ffebe9;
            color: #cf222e
        }

        .stats {
            font-weight: 700;
            color: var(--muted)
        }

        .qcard {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            margin: 14px 0
        }

        .qtitle {
            font-weight: 700;
            margin-bottom: 12px
        }

        .tag {
            display: inline-block;
            background: #fff1f2;
            color: #9f1239;
            border: 1px solid #fecdd3;
            border-radius: 999px;
            padding: 2px 9px;
            font-size: .78rem;
            margin-bottom: 8px
        }

        .options {
            display: grid;
            gap: 8px
        }

        label.option {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            border: 1px solid #d8dee4;
            border-radius: 10px;
            padding: 10px;
            background: #fff;
            cursor: pointer
        }

        label.option:hover {
            border-color: var(--primary);
            background: #fff7ed
        }

        label.correct {
            border-color: var(--ok);
            background: #dafbe1
        }

        label.wrong {
            border-color: var(--bad);
            background: #ffebe9
        }

        .answer,
        .explain {
            display: none;
            margin-top: 10px;
            font-weight: 700
        }

        .explain {
            font-weight: 400;
            color: #57606a
        }

        .answer.show,
        .explain.show {
            display: block
        }

        .toc {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 8px
        }

        .toc a {
            background: #fff7ed;
            border: 1px solid var(--line);
            padding: 8px 10px;
            border-radius: 8px;
            color: #9a3412;
            text-decoration: none;
            font-size: .92rem
        }

        .mode {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center
        }

        .scorebox {
            font-size: 1.08rem
        }

        .footer {
            text-align: center;
            color: var(--muted);
            margin-top: 28px
        }

        @media print {
            header {
                position: static
            }

            .toolbar button,
            .mode {
                display: none
            }

            body {
                background: white
            }

            .qcard {
                break-inside: avoid
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Case Work Questionnaire</h1>
        <p>Total questions: <strong>252</strong></p>
    </header>
    <main class="wrap">
        <section class="panel toolbar">
            <div>
                <div class="stats">Hard mode: With many situational questions.
                </div><small>Submit to see score, correct answers, and short explanations where added.</small>
            </div>
            <div><button class="primary" onclick="submitQuiz()">Submit Quiz</button><button class="secondary"
                    onclick="showAnswers()">Show Answer Key</button><button class="danger"
                    onclick="resetQuiz()">Reset</button></div>
        </section>
        <section class="panel scorebox" id="scoreBox">Score: Not submitted yet.</section>
        <section class="panel">
            <h2>Quick Navigation</h2>
            <div class="toc" id="toc"></div>
        </section>
        <section id="quiz"></section>
        <div class="footer">Created for review purposes. All items are multiple choice.</div>
    </main>
    <script>
        const questions = [{"q": "Which statement best captures the historical meaning of social casework as presented in the reviewer?", "o": ["It is individualized helping through a professional one-to-one relationship focused on social functioning.", "It is group-based treatment primarily intended to develop cohesion among members.", "It is community organizing aimed mainly at policy reform and mass mobilization.", "It is administrative supervision of welfare agencies and public programs."], "a": 0, "e": "Social casework is presented as individualized helping through one-to-one professional relationship."}, {"q": "A client has difficulty fulfilling expected duties as a parent, tenant, and employee. In casework language, this is primarily a problem of:", "o": ["Agency function", "Resource utilization", "Case recording", "Social role performance"], "a": 3, "e": ""}, {"q": "The professional development of social casework became more formal during the:", "o": ["Post-World War II period only", "Twenty-first century period of online practice", "Late nineteenth and early twentieth centuries", "Sixteenth and seventeenth centuries only"], "a": 2, "e": ""}, {"q": "The early practice of friendly visiting contributed to casework because it emphasized:", "o": ["Group interaction as the primary method", "Individualized contact with families in their homes", "Large-scale mass education campaigns", "Formal psychiatric diagnosis as the main intervention"], "a": 1, "e": ""}, {"q": "Which sequence best reflects the development noted in the reviewer?", "o": ["Charity and friendly visiting evolved toward systematic social diagnosis and professional casework.", "Behavior modification developed first, followed by settlement houses and friendly visiting.", "Case management originated before religious and charitable helping systems.", "Community organizing replaced casework before casework became professionalized."], "a": 0, "e": ""}, {"q": "Mary Richmond’s major contribution is most accurately described as:", "o": ["Creating the first settlement house in Chicago for immigrant families", "Developing behavior modification through operant conditioning", "Formulating the functional approach through agency use of time", "Providing a systematic and methodological foundation for documenting and diagnosing clients"], "a": 3, "e": ""}, {"q": "The book Social Diagnosis is significant because it:", "o": ["Established the first Philippine public welfare agency.", "Presented the stages of crisis intervention in detail.", "Identified a systematic way to document and diagnose clients in casework practice.", "Introduced the ten principles of social group work."], "a": 2, "e": ""}, {"q": "A reviewer asks why Mary Richmond is called the mother of social casework. The best answer is that she:", "o": ["Developed the ecological map and genogram.", "Laid scientific and methodological foundations for professional social casework.", "Founded Hull-House and promoted settlement house reform.", "Created the first behavior modification model."], "a": 1, "e": ""}, {"q": "Which pair is correctly matched?", "o": ["Jane Addams - Hull-House", "Mary Richmond - Toynbee Hall", "Helen Perlman - Charity Organization Society founder", "Thomas Chalmers - Behavior modification"], "a": 0, "e": ""}, {"q": "Which personality is most associated with the settlement house movement in Chicago?", "o": ["Mary Richmond", "Gordon Hamilton", "Florence Hollis", "Jane Addams"], "a": 3, "e": ""}, {"q": "A social work student confuses Jane Addams and Mary Richmond. Which distinction is most accurate?", "o": ["Addams created behavior modification; Richmond developed crisis intervention.", "Addams formulated the 7 principles; Richmond developed the 4Ps.", "Addams is associated with settlement houses; Richmond is associated with scientific social casework.", "Addams developed Social Diagnosis; Richmond founded Hull-House."], "a": 2, "e": ""}, {"q": "Thomas Chalmers’ concept of helping the poor to help themselves is closest to which later social work idea?", "o": ["Using punishment to correct dependency", "Strengthening self-help and responsibility through community support", "Providing unconditional permanent public assistance", "Replacing client participation with professional decision-making"], "a": 1, "e": ""}, {"q": "In the reviewer, Juan Luis de Vives is significant because his work reflected:", "o": ["Humanistic and educational reform concerns, including relief of the poor", "Operant conditioning and behavior modification", "Task-centered brief treatment", "Clinical family therapy and systems theory"], "a": 0, "e": ""}, {"q": "Helen Harris Perlman is most closely linked with:", "o": ["Settlement house reform in Chicago", "The Charity Organization Society in 1877", "Classical conditioning experiments", "Problem-solving process in social casework"], "a": 3, "e": ""}, {"q": "Gordon Hamilton is associated with:", "o": ["The first University Settlement", "The 7 principles of Biestek", "Theory and Practice of Social Casework", "Social Diagnosis"], "a": 2, "e": ""}, {"q": "The Daughters of Charity are included in the reviewer because they illustrate:", "o": ["The legal basis of public agency funding", "Religious and social ministry traditions that contributed to organized helping", "Behavioral learning theory in modern assessment", "A task-centered brief treatment model"], "a": 1, "e": ""}, {"q": "In the Philippine context, the first professional method of social work intervention practiced was:", "o": ["Casework", "Social group work", "Community organization", "Social welfare administration"], "a": 0, "e": ""}, {"q": "Casework in the Philippines was introduced in 1917 through:", "o": ["Hull-House", "University Settlement", "Red Cross", "Associated Charities of Manila"], "a": 3, "e": ""}, {"q": "The Associated Charities of Manila is linked to Philippine casework because it employed:", "o": ["Court mediators only", "School counselors only", "Home visitors", "Group therapists"], "a": 2, "e": ""}, {"q": "The present relevance of casework in the Philippines is that it remains a major method focused on:", "o": ["Organizational profit analysis", "Person-situation configuration", "Group cohesion only", "Mass mobilization only"], "a": 1, "e": ""}, {"q": "Mary Richmond’s 1917 definition emphasized better adjustment in:", "o": ["Social relationships of individuals", "Agency policies and procedures", "Community political structures", "Group norms and cohesion"], "a": 0, "e": ""}, {"q": "Perlman’s 1957 definition emphasized helping individuals cope with problems in:", "o": ["Group leadership", "Policy advocacy only", "Community mobilization", "Social functioning"], "a": 3, "e": ""}, {"q": "Which phrase best describes social casework based on the reviewer?", "o": ["Group-centered, recreational, and informal activity", "Mass-based, political, and campaign-oriented action", "Individualized, scientific, and artistic helping", "Administrative, coercive, and legal correction"], "a": 2, "e": ""}, {"q": "Esther Villoria’s definition is broad because it includes material help, referrals, emotional support, listening, advice, and:", "o": ["Using only financial assistance as intervention", "Helping clients examine situations and understand causal connections", "Replacing client decisions with worker decisions", "Avoiding expression of feelings"], "a": 1, "e": ""}, {"q": "Acceptance in Biestek’s principles means the worker responds to the client as:", "o": ["He or she really is, including strengths and weaknesses", "The worker thinks the client should ideally become", "A category member rather than a unique individual", "A person whose statements must always be approved"], "a": 0, "e": ""}, {"q": "Which situation best illustrates acceptance without approval?", "o": ["The worker agrees with every decision the client makes.", "The worker praises the client to avoid discomfort.", "The worker tells the client that negative feelings are unacceptable.", "The worker recognizes a client’s anger and dignity while not endorsing harmful behavior."], "a": 3, "e": ""}, {"q": "Individualization requires the worker to:", "o": ["Focus only on agency eligibility rules.", "Avoid considering culture and life history.", "Recognize the client as unique rather than merely a category member.", "Use identical plans for clients with the same problem label."], "a": 2, "e": ""}, {"q": "Purposeful expression of feelings is violated when the worker:", "o": ["Allows the client to discuss hopes and fears.", "Discourages the client from expressing fear, anger, or hostility.", "Listens to negative feelings without condemnation.", "Recognizes emotional components of requests for help."], "a": 1, "e": ""}, {"q": "Controlled emotional involvement requires:", "o": ["Sensitivity to feelings with disciplined and purposeful response.", "Emotional detachment and refusal to respond to feelings.", "Over-identification with the client’s pain.", "Immediate advice-giving before understanding feelings."], "a": 0, "e": ""}, {"q": "A worker reacts with excessive anger toward a client because the client reminds her of a past experience. This is closest to:", "o": ["Confidentiality", "Partialization", "Universalization", "Counter-transference"], "a": 3, "e": ""}, {"q": "A client treats the worker as if the worker were a rejecting parent from the client’s past. This is closest to:", "o": ["Structuring", "Agency function", "Transference", "Differential diagnosis"], "a": 2, "e": ""}, {"q": "Which worker statement best reflects a nonjudgmental attitude?", "o": ["“I will decide what is morally acceptable for you.”", "“Let us understand what happened and what it means for your situation.”", "“You are wrong, and you should feel guilty.”", "“You are right in everything you did.”"], "a": 1, "e": ""}, {"q": "Why can praise sometimes be considered judgmental in Biestek’s discussion?", "o": ["It can make clients hide parts of themselves to avoid evaluation.", "It is always prohibited in all social work interviews.", "It automatically violates confidentiality.", "It removes the need for assessment."], "a": 0, "e": ""}, {"q": "Client self-determination is limited by:", "o": ["Worker preference, personal convenience, and office schedule", "The client’s educational attainment only", "The availability of case recording forms", "Client capacity, civil and moral law, and agency function"], "a": 3, "e": ""}, {"q": "Which situation reflects appropriate limitation of self-determination?", "o": ["The worker wants a faster solution and chooses for the client.", "The agency prefers clients who accept worker recommendations.", "A client’s choice may endanger others and must be addressed within law and agency mandate.", "The worker dislikes the client’s plan and therefore forbids it."], "a": 2, "e": ""}, {"q": "Confidentiality is not absolute because:", "o": ["Case records are public documents by default.", "Another right or duty may outweigh the client’s right to privacy.", "Private information is never protected in social work.", "All client information must be shared with family members."], "a": 1, "e": ""}, {"q": "Mendoza’s additional principles in the Philippine context include participation of the client, client-worker relationship, and:", "o": ["Worker’s self-awareness", "Reward and punishment", "Formal diagnosis only", "Agency budgeting"], "a": 0, "e": ""}, {"q": "A strong client-worker relationship is essential because the helping process depends not only on problem-solving but also on:", "o": ["Case closure speed", "Agency publicity", "Professional authority alone", "Rapport and relationship"], "a": 3, "e": ""}, {"q": "In social role concepts, the enacted role refers to:", "o": ["The role privately imagined only", "The role assigned by family tradition only", "The role as actually performed in behavior", "The role legally prescribed by an agency"], "a": 2, "e": ""}, {"q": "A prescribed role differs from a subjective role because the prescribed role is:", "o": ["The worker’s diagnosis of the role", "Culturally or socially expected", "The person’s own understanding of the role", "The behavior actually performed"], "a": 1, "e": ""}, {"q": "A client avoids confronting a problem by attaching himself to a stronger person. In the reviewer, this adaptation is:", "o": ["Flight", "Aggression", "Problem-solving", "Conscientization"], "a": 0, "e": ""}, {"q": "Ego defenses become relevant in casework because clients may use them to:", "o": ["Replace assessment and planning", "Guarantee accurate diagnosis", "Eliminate the need for rapport", "Manage anxiety when overwhelmed by stress"], "a": 3, "e": ""}, {"q": "Perlman’s 4Ps are:", "o": ["Problem, policy, practice, profession", "Place, participation, planning, prevention", "Person, problem, place, process", "Person, plan, policy, program"], "a": 2, "e": ""}, {"q": "In the 4Ps, “place” refers primarily to:", "o": ["The physical interview room only", "The social welfare agency or organization providing service", "The home address of the client only", "The client’s social status in the family"], "a": 1, "e": ""}, {"q": "In the 4Ps, “process” refers to:", "o": ["The helping or problem-solving activities through which service is provided", "The client’s social role only", "The agency source of funds only", "The worker’s personality style only"], "a": 0, "e": ""}, {"q": "The “person” in casework is best understood as:", "o": ["A passive recipient of services with no strengths", "An isolated individual separate from environment", "A diagnosis rather than a whole person", "A being shaped by inherited makeup and continuing transactions with life forces"], "a": 3, "e": ""}, {"q": "The multidimensional approach emphasizes that human behavior is:", "o": ["Explained only by economic resources", "Determined only by family history", "Dynamic and shaped by person, environment, and time", "Fixed by personality alone"], "a": 2, "e": ""}, {"q": "A client’s unemployment, grief, family conflict, and cultural expectations are assessed together. This reflects:", "o": ["Closed termination", "Multidimensional assessment", "A single-cause diagnostic approach", "Dole-out assistance"], "a": 1, "e": ""}, {"q": "Which set correctly represents the person dimension?", "o": ["Biological, psychological, social, spiritual", "Family, neighborhood, community, tribe", "Constants, trends, cycles, shifts", "Agency, worker, policy, resources"], "a": 0, "e": ""}, {"q": "Which set correctly represents the environment dimension?", "o": ["Biological, psychological, social, spiritual", "Constants, trends, cycles, time orientation", "Assessment, planning, intervention, termination", "Family, neighborhood, community, social structure, clan or tribe"], "a": 3, "e": ""}, {"q": "A sudden death, trauma, disaster, or war is best classified under time as:", "o": ["Cycle", "Trend", "Shift", "Constant"], "a": 2, "e": ""}, {"q": "A school semester or crop harvest pattern is best classified under time as:", "o": ["Presenting problem", "Cycle", "Shift", "Constant"], "a": 1, "e": ""}, {"q": "Aging is best classified under time as:", "o": ["Constant", "Trend", "Cycle", "Partialization"], "a": 0, "e": ""}, {"q": "An increase in women involved in peace-building is an example of:", "o": ["Shift", "Constant", "Role reversal", "Trend"], "a": 3, "e": ""}, {"q": "A culturally shaped focus on past, present, or future is called:", "o": ["Agency function", "Problem typology", "Time orientation", "Role performance"], "a": 2, "e": ""}, {"q": "A client who personally goes to the agency to seek assistance is a:", "o": ["Involuntary client", "Walk-in client", "Referred client", "Reach-out client"], "a": 1, "e": ""}, {"q": "A student is brought to an agency by a school because of behavioral concerns. This client is best classified as:", "o": ["Referred or involuntary client", "Walk-in client", "Reach-out client", "Former client"], "a": 0, "e": ""}, {"q": "A worker goes to a community and offers help to a person who has not applied for service. This is:", "o": ["Walk-in", "Transfer", "Termination", "Reach-out"], "a": 3, "e": ""}, {"q": "The three general parts of a helping interview are:", "o": ["Assessment, referral, transfer", "Planning, budgeting, evaluation", "Beginning, middle, ending", "Intake, diagnosis, recording"], "a": 2, "e": ""}, {"q": "Helping interviews are flexible and fluid, but the worker must still:", "o": ["Avoid clarification until termination", "Gently guide the process without taking control away from the client", "Follow a rigid script regardless of client need", "Control all decisions to save time"], "a": 1, "e": ""}, {"q": "At the start of the interview, the best worker response is to:", "o": ["Acknowledge the client’s effort in seeking help and invite the client’s view of the problem.", "Immediately complete forms without explanation.", "Tell the client what the real problem is.", "Discuss termination and closing summary first."], "a": 0, "e": ""}, {"q": "Which topic should be discussed early in the interview because it affects trust and disclosure?", "o": ["Agency annual budget", "Professional salary scale", "Community publicity plan", "Confidentiality"], "a": 3, "e": ""}, {"q": "If the agency cannot provide the service needed, the worker should:", "o": ["Persuade the client to change the problem", "Ignore the need because it is outside mandate", "Make an appropriate referral to another resource", "Terminate without explanation"], "a": 2, "e": ""}, {"q": "An open-ended question is best illustrated by:", "o": ["“You agree that your husband is the problem, right?”", "“Can you tell me what happened from your point of view?”", "“You were neglected by your family, correct?”", "“Did you come only for financial assistance?”"], "a": 1, "e": ""}, {"q": "Which question is leading and should be avoided?", "o": ["“Your family caused this problem, did they not?”", "“How do you understand the situation?”", "“What help are you hoping for?”", "“What happened after the incident?”"], "a": 0, "e": ""}, {"q": "Active listening is shown when the worker:", "o": ["Interrupts often to keep the interview fast.", "Gives immediate advice before the client finishes.", "Avoids eye contact and note-taking entirely.", "Pays attention, uses verbal feedback, and observes verbal and nonverbal messages."], "a": 3, "e": ""}, {"q": "Avoiding judgment in an interview is important mainly because judgment may:", "o": ["End the assessment immediately", "Guarantee client self-determination", "Prevent accurate information by making the client hide parts of himself or herself", "Remove the need for confidentiality"], "a": 2, "e": ""}, {"q": "A presenting problem is best defined as:", "o": ["The final outcome after evaluation", "The problem the client system feels is most important or immediate", "The deepest structural cause discovered after long treatment", "Any problem the worker prefers to address first"], "a": 1, "e": ""}, {"q": "A working problem is best understood as:", "o": ["The selected problem or part of the problem that client and worker agree to work on first", "The problem that is always hidden from the client", "The agency’s administrative limitation", "The worker’s personal theory of causation"], "a": 0, "e": ""}, {"q": "A client asks for educational assistance, but assessment shows immediate safety risk due to violence at home. The worker and client first address safety. Safety becomes the:", "o": ["Presenting problem only", "Termination criterion", "Agency source of support", "Working problem"], "a": 3, "e": ""}, {"q": "Partialization is especially useful when:", "o": ["The agency wants to avoid assessment.", "The worker wants to terminate immediately.", "A client has many interrelated problems and one unit of attention must be selected.", "The client has no problem to discuss."], "a": 2, "e": ""}, {"q": "Prioritization differs from partialization because prioritization:", "o": ["Is done only after termination.", "Orders problems according to relevance, gravity, urgency, and magnitude.", "Rejects the client’s perception of the problem.", "Means collecting only secondary data."], "a": 1, "e": ""}, {"q": "In the sample case, food and transportation assistance were considered working/immediate concerns because they were:", "o": ["Urgent needs within the broader request for burial assistance", "Irrelevant to the client’s stated problem", "Long-term policy issues only", "Examples of social transition problems only"], "a": 0, "e": ""}, {"q": "A family has income barely enough for food, rent, and medicine. Under De Guzman’s typology, the primary issue is:", "o": ["Reactive emotional distress", "Problem with formal organization", "Dissatisfaction in social relations", "Problem of livelihood"], "a": 3, "e": ""}, {"q": "A newly widowed spouse struggles after the sudden death of a partner. This is best classified as:", "o": ["Difficulty of role performance", "Agency function problem", "Problem of social transition", "Problem with formal organization"], "a": 2, "e": ""}, {"q": "An employee is in conflict with a company system and its rules. This is closest to:", "o": ["Borderline pathology", "Problem with formal organization", "Reactive emotional distress", "Difficulty in interpersonal relationship only"], "a": 1, "e": ""}, {"q": "A husband and wife cannot easily withdraw from each other but one’s behavior constantly irritates the other. This fits:", "o": ["Difficulty in interpersonal relationships", "Problem of livelihood", "Problem with formal organization", "Case management"], "a": 0, "e": ""}, {"q": "A client’s distress is mainly emotional and clearly follows the death of a loved one. This is:", "o": ["Problem of livelihood", "Formal organization problem", "Agency function issue", "Reactive emotional distress"], "a": 3, "e": ""}, {"q": "A client shows recurrent overt depression and difficulty handling realities of living but remains in touch with reality in some areas. This is closest to:", "o ntact with the client"], "a": 2, "e": ""}, {"q": "Naomi Brill’s skill of differential diagnosis is closest to:", "o": ["Using punishment and reward", "Understanding the uniqueness of the person", "Setting agency policy", "Providing material aid only"], "a": 1, "e": ""}, {"q": "Timing as a skill requires the worker to:", "o": ["Match action and pace to the client’s readiness and need", "Proceed as quickly as possible in every case", "Delay all action until termination", "Follow the worker’s tempo only"], "a": 0, "e": ""}, {"q": "Focusing is the worker’s skill in:", "o": ["Collecting all possible information without selection", "Ending the case quickly", "Avoiding problem definition", "Concentrating effort with the client on significant aspects of the situation"], "a": 3, "e": ""}, {"q": "Partialization as a skill means:", "o": ["Avoiding client participation", "Skipping prioritization", "Breaking the total problem into manageable parts", "Choosing the worker’s preferred solution"], "a": 2, "e": ""}, {"q": "Structuring involves:", "o": ["Replacing empathy with rules", "Setting boundaries and conditions conducive to work while remaining flexible", "Removing all limits from the helping relationship", "Terminating the case at intake"], "a": 1, "e": ""}, {"q": "Establishing partnership includes:", "o": ["Engagement, empathy, communication, and observation", "Punishment, confrontation, referral, and transfer", "Diagnosis, funding, publicity, and termination", "Policy, program, budget, and audit"], "a": 0, "e": ""}, {"q": "Empathy is best shown when the worker:", "o": ["Feels exactly the same and loses objectivity", "Judges the client’s choices quickly", "Avoids emotional content entirely", "Understands the client’s perspective without losing professional boundaries"], "a": 3, "e": ""}, {"q": "Observation in social work includes:", "o": ["Replacing the client’s story with worker assumptions", "Recording only demographic data", "Noticing verbal and nonverbal communication related to interview objectives", "Watching without interpreting anything"], "a": 2, "e": ""}, {"q": "Small talk is useful mainly to:", "o": ["Terminate dependency issues", "Break the ice and ease entry into the helping relationship", "Avoid discussing problems permanently", "Complete assessment without questions"], "a": 1, "e": ""}, {"q": "Support through ventilation means:", "o": ["Allowing feelings and attitudes to surface while sustaining client functioning", "Giving false assurance that everything will be fine", "Using punishment to shape behavior", "Ignoring emotional expression"], "a": 0, "e": ""}, {"q": "Reassurance and instillation of hope should be:", "o": ["Messianic and unlimited", "Used to avoid assessment", "Given even when false", "Realistic and grounded in attainable possibilities"], "a": 3, "e": ""}, {"q": "Exploration is used to:", "o": ["Avoid painful topics permanently", "Replace client narrative with agency records", "Elicit details about experiences, relationships, and related feelings", "End the interview immediately"], "a": 2, "e": ""}, {"q": "Clarification is most appropriate when:", "o": ["The client should stop expressing feelings", "The worker and client need the same understanding of a point or issue", "The worker wants to impose a decision", "The case is ready for abrupt termination"], "a": 1, "e": ""}, {"q": "Education and advice should be used to:", "o": ["Offer suggestions and facts that stimulate the client’s thinking and feeling", "Control the client’s choices", "Replace self-determination", "Avoid client participation"], "a": 0, "e": ""}, {"q": "Universalization helps the client by:", "o": ["Labeling the client as the same as all others", "Rejecting individualization", "Avoiding cultural context", "Using common human experiences to reduce isolation and support coping"], "a": 3, "e": ""}, {"q": "Reward and punishment techniques require:", "o": ["Ignoring target behavior", "Only emotional ventilation", "Understanding causes and ability to anticipate consequences", "No assessment of behavior"], "a": 2, "e": ""}, {"q": "Role rehearsal and demonstration are most useful when the client needs:", "o": ["Diagnosis without action", "Practice for a real-life situation", "Closed case recording", "Agency funding"], "a": 1, "e": ""}, {"q": "Confrontation in casework is best understood as:", "o": ["Helping the client face hard facts of reality and contradictions", "Humiliating the client for mistakes", "Ending rapport intentionally", "Forcing client decisions"], "a": 0, "e": ""}, {"q": "Constructive manipulation means:", "o": ["Deceiving the client for agency convenience", "Eliminating client choice", "Using coercion as primary intervention", "Skillful management of events without exploiting others"], "a": 3, "e": ""}, {"q": "Andragogy refers to:", "o": ["Crisis intervention within 72 hours", "Clinical diagnosis of pathology", "Art and science in working with older persons", "Work with children in school settings"], "a": 2, "e": ""}, {"q": "Conscientization is best described as:", "o": ["Using only behavior reinforcement", "Awakening critical awareness through liberating education and action-reflection-action", "Providing charity without client participation", "Avoiding social context in casework"], "a": 1, "e": ""}, {"q": "An eco-map is useful because it:", "o": ["Shows relationships between individual/family and environmental systems", "Displays only hereditary family patterns", "Measures target behavior frequency only", "Records termination reactions only"], "a": 0, "e": ""}, {"q": "A genogram is especially useful for understanding:", "o": ["Agency sources of public funds", "Community resource directories only", "Task completion schedules only", "Family dynamics, perceived identity, and behavior patterns"], "a": 3, "e": ""}, {"q": "Environmental modification in Hollis’ processes means:", "o": ["Closing the agency case", "Withdrawing reinforcement", "Changing the environment in the client’s favor by worker action", "Changing only the client’s thoughts"], "a": 2, "e": ""}, {"q": "Psychological support in Hollis’ processes includes:", "o": ["Punishment and extinction", "Encouraging expression of feelings and sympathetic understanding", "Material assistance only", "Policy advocacy only"], "a": 1, "e": ""}, {"q": "Clarification in Hollis’ processes strengthens the ego by helping the client:", "o": ["See external realities and personal emotions more realistically", "Avoid discussing difficult facts", "Depend fully on the worker", "Ignore causal connections"], "a": 0, "e": ""}, {"q": "Insight development goes beyond clarification because it:", "o": ["Avoids emotional content", "Focuses only on concrete resources", "Ends the case immediately", "Carries understanding of the situation to a deeper level"], "a": 3, "e": ""}, {"q": "A mother requests burial assistance, but she has not eaten, lacks fare home, and must retrieve clothes for the deceased. What should the worker do first in casework problem definition?", "o": ["Terminate because the problem is too broad.", "Focus only on the presenting request and avoid new information.", "Partialize and prioritize immediate food, transportation, and burial-related needs with the client.", "Ignore immediate needs and discuss only long-term poverty."], "a": 2, "e": ""}, {"q": "A client says, “I came for cash assistance only,” but the worker notices fear and signs of domestic violence. Which response best reflects casework practice?", "o": ["Record domestic violence as fact without client discussion.", "Explore the client’s perception while assessing safety, urgency, and possible working problems.", "Tell the client the real problem is domestic violence and stop discussing assistance.", "Provide cash and avoid asking further questions."], "a": 1, "e": ""}, {"q": "A worker begins with the client’s stated concern even though the worker suspects deeper issues. This most strongly respects:", "o": ["Client frame of reference and engagement", "Worker dominance and diagnosis", "Termination planning", "Agency funding source"], "a": 0, "e": ""}, {"q": "A client has several problems: unpaid rent, school dropout of a child, marital conflict, and illness. Which skill helps convert this into manageable work?", "o": ["Confrontation followed by punishment", "Termination followed by referral only", "Universalization followed by case closure", "Partialization followed by prioritization"], "a": 3, "e": ""}, {"q": "A worker gives a client a list of agencies but does not assist with eligibility, procedures, or follow-up despite the client’s confusion. Which role was weakly performed?", "o": ["Case recorder", "Functional diagnostician", "Social broker", "Nonjudgmental listener"], "a": 2, "e": ""}, {"q": "A client wants to refuse medical care for a child due to misinformation. The worker respects choices but must consider the child’s safety and law. This illustrates limits of:", "o": ["Universalization", "Client self-determination", "Acceptance", "Partialization"], "a": 1, "e": ""}, {"q": "During planning, a client’s problem is “no stable income.” Which goal best turns the problem upside down?", "o": ["Client will identify and access feasible income support or livelihood options within an agreed timeframe.", "Client has no stable income.", "Worker will decide what job the client must take.", "Agency will record the client as unemployed."], "a": 0, "e": ""}, {"q": "A social worker constantly rescues the client and makes all decisions, resulting in dependency. Which casework principle is most at risk?", "o": ["Confidentiality", "Case recording", "Agency function", "Client self-determination"], "a": 3, "e": ""}, {"q": "A client repeatedly compares the worker to a strict former teacher and reacts defensively even when the worker is neutral. This is:", "o": ["Prioritization", "Outcome evaluation", "Transference", "Counter-transference"], "a": 2, "e": ""}, {"q": "The worker feels unusually protective toward a client who reminds him of a younger sibling. This requires attention to:", "o": ["Eco-map construction", "Worker self-awareness and counter-transference", "Client self-determination only", "Formal organization problems"], "a": 1, "e": ""}, {"q": "A disaster survivor needs relief goods, safe shelter, and processing of fear. Which combination best fits crisis intervention tasks?", "o": ["Material-arrangement tasks and psychosocial tasks", "Only family genogram and termination", "Only behavior extinction and punishment", "Only policy critique and documentation"], "a": 0, "e": ""}, {"q": "A client in acute crisis applies for help today. The agency schedules first contact after three months. This violates the crisis principle of:", "o": ["Long-term Freudian analysis", "Termination bargaining", "Functional use of agency", "Timely availability within 24 to 72 hours when possible"], "a": 3, "e": ""}, {"q": "A worker helps a client practice what to say before attending a court hearing. The technique is:", "o": ["Conscientization", "Extinction", "Role rehearsal and demonstration", "Universalization"], "a": 2, "e": ""}, {"q": "A worker says, “Many people in similar grief feel confused at first; let us look at what support you have.” This uses:", "o": ["Manipulation for exploitation", "Universalization with support", "Judgmental praise", "Punishment"], "a": 1, "e": ""}, {"q": "A worker asks, “What happened after you received the eviction notice?” rather than “You failed to pay because you were irresponsible, right?” This demonstrates:", "o": ["Open-ended, nonjudgmental interviewing", "Leading questioning", "Confrontation as punishment", "Direct influence only"], "a": 0, "e": ""}, {"q": "A client’s main need is dialysis assistance, counseling, transport support, and PhilHealth coordination. Which approach is especially relevant?", "o": ["Small talk only", "Termination denial", "Closed case recording", "Case management"], "a": 3, "e": ""}, {"q": "A worker considers how poverty, gender, disability, and single parenthood combine in the client’s experience. This reflects:", "o": ["Functional approach only", "Classificatory diagnosis only", "Intersectionality perspective", "Behavior modification only"], "a": 2, "e": ""}, {"q": "A client learns to attend job interviews by completing agreed weekly tasks in a time-limited plan. This is most consistent with:", "o": ["Daughters of Charity tradition", "Task-centered model", "Crisis generic approach", "Settlement house movement"], "a": 1, "e": ""}, {"q": "A child’s tantrum decreases when caregivers stop giving candy after screaming and praise calm asking. This combines:", "o": ["Extinction and reinforcement", "Catharsis and insight development", "Referral and transfer", "Acceptance and confidentiality"], "a": 0, "e": ""}, {"q": "A worker arranges a home visit with relatives to reduce environmental stressors contributing to the client’s problem. This fits:", "o": ["Outcome evaluation only", "Nonjudgmental attitude only", "Termination bargaining", "Indirect psychosocial treatment or environmental modification"], "a": 3, "e": ""}, {"q": "A client begins to withdraw because the case will end soon. This reaction is closest to which termination component?", "o": ["Contracting", "Reintegration", "Depression", "Acceptance"], "a": 2, "e": ""}, {"q": "A client asks to extend sessions even after goals are achieved because separation feels difficult. This is most likely:", "o": ["Antecedent behavior", "Bargaining in termination", "Assessment opening statement", "Task-centered implementation"], "a": 1, "e": ""}, {"q": "A worker gathers extensive unrelated details about childhood hobbies for an emergency food request. Which principle is being violated?", "o": ["Parsimony", "Universalization", "Client participation", "Timing"], "a": 0, "e": ""}, {"q": "A worker chooses a model after considering client need, agency capacity, and worker competence rather than rigidly applying one theory. This is:", "o": ["Classical conditioning", "Denied termination", "Prescribed role", "Eclectic approach"], "a": 3, "e": ""}, {"q": "A social worker develops rapport but never identifies a working problem or goal. What is missing?", "o": ["Small talk", "Initial greeting", "Problem definition and planning", "Acceptance"], "a": 2, "e": ""}, {"q": "A worker identifies that the client can make decisions, has family support, and can access barangay resources. This assessment focuses on:", "o": ["Agency limitations only", "Strengths and resources", "Pathology only", "Moral blame"], "a": 1, "e": ""}, {"q": "A worker tells a client, “You should do exactly what I did when I had the same problem.” This is problematic because it weakens:", "o": ["Individualization and self-determination", "Case recording and referral", "Agency source of support", "Outcome evaluation"], "a": 0, "e": ""}, {"q": "A client wants the worker to decide whether she should leave home. The best self-determination-consistent response is:", "o": ["Decide for her to avoid anxiety.", "Refuse to discuss the issue.", "Tell her what most clients choose.", "Help her examine options, risks, resources, and possible consequences."], "a": 3, "e": ""}, {"q": "A worker uses an eco-map and discovers that the client has strong church support but weak school coordination. The tool helped assess:", "o": ["Target behavior frequency", "Termination readiness", "Environmental relationships and support systems", "Family hereditary patterns only"], "a": 2, "e": ""}, {"q": "A genogram reveals repeated patterns of early marriage, separation, and caregiving roles across generations. The tool helped examine:", "o": ["Case evaluation outcomes", "Family dynamics and behavior patterns", "Agency eligibility rules", "Community resources only"], "a": 1, "e": ""}]; const quiz = document.getElementById('quiz'); const toc = document.getElementById('toc'); const letter = i => ['A', 'B', 'C', 'D'][i];
        function isSituational(q) {return /client|worker|mother|student|family|parent|child|disaster|survivor|employee|widowed|asks|says|case|home|practice|situation/i.test(q.q)}
        questions.forEach((item, i) => {
            if (i % 20 === 0) {const a = document.createElement('a'); a.href = '#q' + (i + 1); a.textContent = `Questions ${i + 1}-${Math.min(i + 20, questions.length)}`; toc.appendChild(a);}
            const card = document.createElement('article'); card.className = 'qcard'; card.id = 'q' + (i + 1);
            const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = isSituational(item) ? 'Situational / Application' : 'Conceptual / Recall'; card.appendChild(tag);
            const title = document.createElement('div'); title.className = 'qtitle'; title.textContent = `${i + 1}. ${item.q}`; card.appendChild(title);
            const opts = document.createElement('div'); opts.className = 'options'; item.o.forEach((opt, j) => {const lab = document.createElement('label'); lab.className = 'option'; lab.dataset.q = i; lab.dataset.o = j; lab.innerHTML = `<input type="radio" name="q${i}" value="${j}"> <span><strong>${letter(j)}.</strong> ${opt}</span>`; opts.appendChild(lab);}); card.appendChild(opts);
            const ans = document.createElement('div'); ans.className = 'answer'; ans.id = 'ans' + i; ans.textContent = `Correct answer: ${letter(item.a)}. ${item.o[item.a]}`; card.appendChild(ans);
            if (item.e) {const ex = document.createElement('div'); ex.className = 'explain'; ex.id = 'exp' + i; ex.textContent = 'Explanation: ' + item.e; card.appendChild(ex);}
            quiz.appendChild(card);
        });
        function submitQuiz() {let score = 0, answered = 0; document.querySelectorAll('label.option').forEach(l => l.classList.remove('correct', 'wrong')); questions.forEach((item, i) => {const selected = document.querySelector(`input[name="q${i}"]:checked`); const labels = document.querySelectorAll(`label[data-q="${i}"]`); labels[item.a].classList.add('correct'); if (selected) {answered++; const val = Number(selected.value); if (val === item.a) score++; else labels[val].classList.add('wrong');} document.getElementById('ans' + i).classList.add('show'); const ex = document.getElementById('exp' + i); if (ex) ex.classList.add('show');}); const pct = ((score / questions.length) * 100).toFixed(2); document.getElementById('scoreBox').innerHTML = `<strong>Score: ${score} / ${questions.length} (${pct}%)</strong><br>Answered: ${answered} / ${questions.length}`; window.scrollTo({top: 0, behavior: 'smooth'});}
        function showAnswers() {document.querySelectorAll('label.option').forEach(l => l.classList.remove('correct', 'wrong')); questions.forEach((item, i) => {document.querySelectorAll(`label[data-q="${i}"]`)[item.a].classList.add('correct'); document.getElementById('ans' + i).classList.add('show'); const ex = document.getElementById('exp' + i); if (ex) ex.classList.add('show');});}
        function resetQuiz() {document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false); document.querySelectorAll('label.option').forEach(l => l.classList.remove('correct', 'wrong')); document.querySelectorAll('.answer,.explain').forEach(a => a.classList.remove('show')); document.getElementById('scoreBox').textContent = 'Score: Not submitted yet.'; window.scrollTo({top: 0, behavior: 'smooth'});}
    </script>

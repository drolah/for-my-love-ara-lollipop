<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hard Social Work with Groups Questionnaire</title>
    <style>
        :root {
            --primary: #065f46;
            --primary2: #0f766e;
            --bg: #ecfdf5;
            --card: #fff;
            --text: #1f2328;
            --muted: #57606a;
            --ok: #1a7f37;
            --bad: #cf222e;
            --line: #d0d7de
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.55
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: white;
            padding: 28px 18px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .18)
        }

        header h1 {
            margin: 0 0 6px;
            font-size: clamp(1.35rem, 3vw, 2.35rem)
        }

        header p {
            margin: 0;
            opacity: .96
        }

        .wrap {
            max-width: 1080px;
            margin: 22px auto;
            padding: 0 16px 90px
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04)
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            margin: 3px
        }

        .primary {
            background: var(--primary);
            color: white
        }

        .secondary {
            background: #eaeef2;
            color: #24292f
        }

        .danger {
            background: #ffebe9;
            color: #cf222e
        }

        .stats {
            font-weight: 700;
            color: var(--muted)
        }

        .qcard {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            margin: 14px 0
        }

        .qtitle {
            font-weight: 700;
            margin-bottom: 12px
        }

        .tag {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            border-radius: 999px;
            padding: 2px 9px;
            font-size: .78rem;
            margin-bottom: 8px
        }

        .options {
            display: grid;
            gap: 8px
        }

        label.option {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            border: 1px solid #d8dee4;
            border-radius: 10px;
            padding: 10px;
            background: #fff;
            cursor: pointer
        }

        label.option:hover {
            border-color: var(--primary);
            background: #ecfdf5
        }

        label.correct {
            border-color: var(--ok);
            background: #dafbe1
        }

        label.wrong {
            border-color: var(--bad);
            background: #ffebe9
        }

        .answer,
        .explain {
            display: none;
            margin-top: 10px;
            font-weight: 700
        }

        .explain {
            font-weight: 400;
            color: #57606a
        }

        .answer.show,
        .explain.show {
            display: block
        }

        .toc {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 8px
        }

        .toc a {
            background: #ecfdf5;
            border: 1px solid var(--line);
            padding: 8px 10px;
            border-radius: 8px;
            color: #047857;
            text-decoration: none;
            font-size: .92rem
        }

        .scorebox {
            font-size: 1.08rem
        }

        .footer {
            text-align: center;
            color: var(--muted);
            margin-top: 28px
        }

        @media print {
            header {
                position: static
            }

            .toolbar button {
                display: none
            }

            body {
                background: white
            }

            .qcard {
                break-inside: avoid
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Hard Group Work Questionnaire</h1>
        <p>Total questions: <strong>247</strong></p>
    </header>
    <main class="wrap">
        <section class="panel toolbar">
            <div>
                <div class="stats">Hard mode: With many situational questions.</div>
                <small>Click Submit Quiz to see score, correct answers, and explanations where included.</small>
            </div>
            <div><button class="primary" onclick="submitQuiz()">Submit Quiz</button><button class="secondary"
                    onclick="showAnswers()">Show Answer Key</button><button class="danger"
                    onclick="resetQuiz()">Reset</button></div>
        </section>
        <section class="panel scorebox" id="scoreBox">Score: Not submitted yet.</section>
        <section class="panel">
            <h2>Quick Navigation</h2>
            <div class="toc" id="toc"></div>
        </section>
        <section id="quiz"></section>
        <div class="footer">Created for review purposes. All items are multiple choice.</div>
    </main>
    <script>
        const questions = [{"q": "Social group work emerged in the first quarter of the twentieth century partly as a middle ground between:", "o": ["Individual casework and community/policy work", "Case management and behavior modification", "Clinical diagnosis and psychiatric hospitalization", "Settlement house work and charity recording"], "a": 0, "e": ""}, {"q": "Papell’s view of social group work is best summarized as a method that helped social work:", "o": ["Replace casework with community organization", "Develop psychiatric classification for groups", "Limit practice to recreational activities", "Operationalize its ideology and social mission"], "a": 3, "e": ""}, {"q": "Historically, the values grounding social group work include:", "o": ["Individual pathology, diagnosis, and treatment planning only", "Resource provision, referral, and case recording", "Social reform, social responsibility, democratic ideals, and social action", "Authoritarian leadership, compliance, and institutional control"], "a": 2, "e": ""}, {"q": "The justice-related roots of group work are best reflected in:", "o": ["Reducing social work to agency reporting requirements", "Highlighting inequality, advocacy, and empowerment of oppressed communities", "Maintaining group leisure activities as the sole goal", "Using group pressure to enforce conformity without discussion"], "a": 1, "e": ""}, {"q": "Mary Richmond’s comment that social group work was the future of social treatment is significant because it shows:", "o": ["Early recognition of group work as a valuable helping method", "Her rejection of individual casework as a method", "The origin of Tuckman’s group stages", "The beginning of the remedial model in the Philippines"], "a": 0, "e": ""}, {"q": "Emory Bogardus is historically important in group work because he:", "o": ["Developed the five bases of power", "Formulated Tuckman’s stages", "Created the psychosocial approach", "Outlined the Ten Standards for Group Work"], "a": 3, "e": ""}, {"q": "The National Association for the Study of Group Work later became:", "o": ["Philippine Mental Health Association", "Department of Social Welfare", "American Association of Group Work", "National Association of Social Workers"], "a": 2, "e": ""}, {"q": "The 1948 AAGW statement emphasized that the group worker should influence group process so decisions result from:", "o": ["External agency orders only", "Shared knowledge and integration of ideas", "Domination by the worker", "Majority pressure without discussion"], "a": 1, "e": ""}, {"q": "Trecker’s statement that group work is a method in social work means:", "o": ["Group work is not a separate profession from social work", "Group work replaces all social work methods", "Group work is only recreation and leisure", "Social work is only group therapy"], "a": 0, "e": ""}, {"q": "Which set best represents essential ingredients of group work?", "o": ["Intake, diagnosis, prognosis, case recording, and termination only", "Reward, coercion, punishment, extinction, and reinforcement only", "Study, assessment, classification, and individual treatment only", "Inclusion, mutual aid, cohesion, conflict resolution, communication, and development"], "a": 3, "e": ""}, {"q": "Before the 1960s, social group work in the Philippines was traced mainly to:", "o": ["Formal case management programs in DSWD", "Task-centered family practice", "Socio-civic movements during American colonial rule", "Psychiatric hospital group therapy only"], "a": 2, "e": ""}, {"q": "Which organizations helped pave the way for Philippine group-serving agencies?", "o": ["PMHA, DSSD, and Red Cross only", "YMCA, YWCA, and Boy Scouts of the Philippines", "COS, Hull-House, and Toynbee Hall", "AAGW, NASW, and CSWE"], "a": 1, "e": ""}, {"q": "The early use of groups in socio-civic agencies focused mainly on:", "o": ["Personality development, character-building, and socialization", "Clinical diagnosis and psychiatric labeling", "Policy advocacy and legislative lobbying only", "Case recording and resource brokerage"], "a": 0, "e": ""}, {"q": "Why did group work initially appear unattractive to many social work graduates in the Philippines?", "o": ["It was considered a purely medical specialty", "It required no formal training", "It was limited to court-mandated clients", "It retained an image as a leisure-time activity"], "a": 3, "e": ""}, {"q": "By the late 1950s, the Philippine Youth Welfare Coordinating Council used groups for:", "o": ["Resource provision for disaster victims only", "Termination planning for institutional residents", "Preventive and developmental goals with out-of-school youth", "Clinical psychotherapy for adult psychiatric patients only"], "a": 2, "e": ""}, {"q": "Foster Parents Plan, Inc. organized mothers’ groups mainly for:", "o": ["Psychiatric classification and diagnosis", "Responsible parenthood, vocational efficiency, and citizenship training", "Court diversion, probation, and correctional custody", "Legislative lobbying and political protest only"], "a": 1, "e": ""}, {"q": "The Philippine Mental Health Association community outreach program in 1958 to 1959 addressed:", "o": ["Prevention of juvenile delinquency through parent education", "Settlement house residence for immigrants", "Task group policy evaluation", "Behavior modification in schools only"], "a": 0, "e": ""}, {"q": "In the 1960s, PMHA used group therapy sessions and:", "o": ["Settlement house home visiting", "Charity organization friendly visiting", "Tuckman’s adjourning model only", "Psychodrama with emotionally disturbed patients"], "a": 3, "e": ""}, {"q": "In government housing and resettlement, tenants’ groups and household heads’ groups addressed concerns such as:", "o": ["Clinical diagnosis of members’ personality disturbance", "Termination of casework relationships", "Water supply, garbage disposal, idleness, unemployment, and community problems", "Only recreational games and cultural programs"], "a": 2, "e": ""}, {"q": "During Martial Law, consciousness-raising efforts helped poor communities understand that many problems were due to:", "o": ["Absence of psychiatric hospitalization", "Deficiencies in social situations", "Individual irresponsibility only", "Lack of recreational programs only"], "a": 1, "e": ""}, {"q": "Small group work connected to broader community issues was referred to as:", "o": ["Community Group Work", "Remedial treatment sequence", "Individual-focused assessment", "Private pre-group phase"], "a": 0, "e": ""}, {"q": "From 2015 onward, group services were described as serving several purposes, including:", "o": ["Diagnosis, prognosis, and clinical termination only", "Resource provision, referral, and transfer only", "Reward, punishment, and extinction only", "Developmental, socialization/resocialization, and treatment or rehabilitation"], "a": 3, "e": ""}, {"q": "A parents’ group acquiring effective parenting skills is an example of the group work purpose called:", "o": ["Court-mandated resocialization only", "Disintegration phase", "Developmental purpose", "Treatment purpose only"], "a": 2, "e": ""}, {"q": "A group for victims of natural disaster or abuse is most closely associated with:", "o": ["Private pre-group phase", "Treatment or rehabilitation purpose", "Leisure-time goal only", "Primary group classification only"], "a": 1, "e": ""}, {"q": "A group differs from an aggregate because a group has:", "o": ["Interaction, norms, goals, cohesion, and a sense of entity", "Only physical closeness without meaningful interaction", "No common purpose or shared impressions", "A completely unorganized collection of persons"], "a": 0, "e": ""}, {"q": "A crowd watching an accident is best classified as:", "o": ["Treatment group", "Task group", "Primary group", "Aggregate"], "a": 3, "e": ""}, {"q": "A family is best considered a group rather than an aggregate because members typically have:", "o": ["No bond or significant interaction", "No shared expectations", "Continuing interaction, norms, roles, and shared identity", "Only same physical location"], "a": 2, "e": ""}, {"q": "A social group is characterized by members who identify and interact personally as individuals, similar to:", "o": ["A formal agency record", "A natural group", "An aggregate", "A public pre-group announcement"], "a": 1, "e": ""}, {"q": "A primary group is marked by Gemeinschaft relationships, meaning relationships based on:", "o": ["Common feeling", "Formal contract", "Agency mandate", "Therapeutic diagnosis"], "a": 0, "e": ""}, {"q": "Which is the best example of a natural group?", "o": ["Agency-sponsored parenting class", "Court-created rehabilitation group", "Committee appointed by management", "Friendship network"], "a": 3, "e": ""}, {"q": "A group created through outside intervention or sponsorship is a:", "o": ["Aggregate", "Primary group only", "Formed group", "Natural group"], "a": 2, "e": ""}, {"q": "A youth group organized by a social worker for skills training is best classified as:", "o": ["Crowd", "Formed group", "Natural group", "Aggregate"], "a": 1, "e": ""}, {"q": "An in-group is one in which the individual:", "o": ["Feels belonging and shares expectations with members", "Has no sense of belonging", "Only shares a location with others", "Is referred for intake but has not met the group"], "a": 0, "e": ""}, {"q": "An out-group is best described as:", "o": ["A task group with elected officers", "A group receiving treatment services", "A primary group with common feeling", "A social grouping where the person does not feel belonging"], "a": 3, "e": ""}, {"q": "Treatment groups are also called small helping groups because they aim to:", "o": ["Serve only as administrative committees", "Function only as public advocacy coalitions", "Meet personal and socio-emotional needs of members", "Complete an external job unrelated to member needs"], "a": 2, "e": ""}, {"q": "Task groups differ from treatment groups because task groups primarily aim to:", "o": ["Increase member insight and support only", "Accomplish a job, activity, advice, or monitoring function", "Meet members’ socio-emotional needs", "Provide psychotherapy through mutual aid only"], "a": 1, "e": ""}, {"q": "A hospital patient support group is most likely a:", "o": ["Treatment group", "Task group", "Aggregate", "Public pre-group phase"], "a": 0, "e": ""}, {"q": "A committee formed to plan a community feeding program is most likely a:", "o": ["Treatment group", "Natural group", "Support group", "Task group"], "a": 3, "e": ""}, {"q": "A growth group mainly aims to:", "o": ["Negotiate with an external agency only", "Monitor program compliance only", "Develop members’ potential, awareness, and insight", "Complete an assigned report"], "a": 2, "e": ""}, {"q": "A socialization group mainly aims to:", "o": ["Evaluate social welfare legislation only", "Increase communication and social skills", "Change environmental policy", "Produce a written agency plan"], "a": 1, "e": ""}, {"q": "A therapy group primarily aims to:", "o": ["Change behavior through correction, coping, rehabilitation, and problem-solving", "Complete a community task", "Serve as an aggregate for observation", "Announce a future group program"], "a": 0, "e": ""}, {"q": "An education group primarily uses:", "o": ["Punitive authority and coercive power", "Administrative reporting only", "No planned program media", "Presentations, discussions, and experience"], "a": 3, "e": ""}, {"q": "When the group is the medium of change, the target of change is:", "o": ["The agency policy only", "The group structure without member change", "The individual member", "The social environment only"], "a": 2, "e": ""}, {"q": "When the group is the target of change, the worker may focus on:", "o": ["Only material resource provision", "Group size, composition, climate, or structure", "Only external social policy", "Only individual diagnosis"], "a": 1, "e": ""}, {"q": "When the group is the agent of change, the group primarily:", "o": ["Acts on social environment forces that affect its goals", "Receives individual treatment from the worker", "Changes only its internal communication channels", "Avoids all social action"], "a": 0, "e": ""}, {"q": "A tenants’ association bargaining for water supply improvements uses the group as:", "o": ["Medium of change only", "Target of change only", "Aggregate", "Agent of change"], "a": 3, "e": ""}, {"q": "A worker uses peer support within a group to help a shy member communicate better. The group is the:", "o": ["Aggregate", "External institution", "Medium of change", "Agent of change"], "a": 2, "e": ""}, {"q": "A worker changes the size and membership mix because the group climate blocks participation. The group is the:", "o": ["Referral source", "Target of change", "Agent of change", "Aggregate"], "a": 1, "e": ""}, {"q": "Which is a valid use of groups for effect on participants?", "o": ["Attitude change, behavioral change, support, belonging, and learning", "Replacing all individual responsibility with worker control", "Avoiding democratic process", "Using members only as a crowd"], "a": 0, "e": ""}, {"q": "An advantage of group approach is the helper therapy principle, meaning:", "o": ["The worker obtains therapy from group members", "Members avoid personal growth by helping others", "The agency saves resources by eliminating intervention", "Members receive psychological rewards from helping others"], "a": 3, "e": ""}, {"q": "A social worker chooses group approach because several clients share similar problems and can support one another. This best reflects:", "o": ["Leader-centered domination", "Psychopathology-based intervention only", "Appropriateness of group approach for common problems", "Misuse of group as personal gain"], "a": 2, "e": ""}, {"q": "Work with groups becomes social work when clients:", "o": ["Avoid concern for consequences of behavior on others", "Learn from each other through democratic group process under social work auspices", "Follow the leader without mutual responsibility", "Use the group only for individual gain"], "a": 1, "e": ""}, {"q": "Work with groups is not social work when:", "o": ["The group is used mainly for personal gain without regard for others", "Clients learn from each other", "The worker helps members consider social consequences", "Social change is intentionally pursued"], "a": 0, "e": ""}, {"q": "A worker who calls himself the group leader and treats clients as followers violates social group work because:", "o": ["It increases mutual aid and self-determination", "It strengthens group-centered communication", "It supports members learning from one another", "It undermines democratic mutual learning and member participation"], "a": 3, "e": ""}, {"q": "Social groupwork as defined by Lindsay and Orton aims to help individuals and groups meet needs and influence:", "o": ["Only clinical diagnosis and treatment classification", "Only agency budgeting and reporting", "Personal, group, organizational, and community problems", "Only individual self-change without group reference"], "a": 2, "e": ""}, {"q": "Group structure refers to:", "o": ["The aggregate of persons in one place", "Patterns that develop and maintain themselves in interpersonal relations", "The final written evaluation of the group", "The list of external resources only"], "a": 1, "e": ""}, {"q": "Formal structure is more likely in:", "o": ["Task groups or social action groups with officers", "Unplanned street crowds", "Aggregates waiting for transportation", "Embryonic groups before dynamics exist"], "a": 0, "e": ""}, {"q": "Group size matters because it affects:", "o": ["Only the agency budget", "Only the worker’s title", "The historical origin of the group", "Amount and quality of communication and interpersonal relations"], "a": 3, "e": ""}, {"q": "A group with too many members for confidential sharing may struggle because size sets limits on:", "o": ["Written contract legality", "Public announcement procedures", "Direct and intensive communication", "Agency sponsorship"], "a": 2, "e": ""}, {"q": "Communication structure concerns:", "o": ["Only physical venue and schedule", "Who interacts with whom, about what, verbally or nonverbally", "Only leadership election rules", "Only member attendance records"], "a": 1, "e": ""}, {"q": "A desirable communication pattern in group work is:", "o": ["Group-centered rather than leader-centered", "Leader-centered rather than group-centered", "Worker-dominated for efficiency", "Silent and one-way"], "a": 0, "e": ""}, {"q": "Affectional structure is seen when members:", "o": ["Vote on formal officers only", "Create a written contract", "Receive agency referrals", "Develop liking or dislike through interaction"], "a": 3, "e": ""}, {"q": "Power structure is important because power facilitates organization, control, and:", "o": ["Termination only", "Public recruitment", "Goal attainment", "Avoidance of interaction"], "a": 2, "e": ""}, {"q": "Manipulation is destructive power because it:", "o": ["Strengthens democratic self-determination", "Reduces cooperation and creates maintenance problems", "Always promotes group best interest", "Is the same as influencing with integrity"], "a": 1, "e": ""}, {"q": "Influencing with integrity means influence is directed toward:", "o": ["The group’s best interest", "A member’s private profit", "Worker domination", "Avoidance of conflict"], "a": 0, "e": ""}, {"q": "Reward power depends on members valuing the reward and believing:", "o": ["The worker has no influence", "The reward is irrelevant", "Punishment is impossible", "It cannot be obtained from anyone else"], "a": 3, "e": ""}, {"q": "Coercive power is based on the perception that a person can:", "o": ["Be liked and identified with", "Represent internalized democratic norms only", "Punish or remove positive consequences", "Provide expert knowledge only"], "a": 2, "e": ""}, {"q": "Referent power operates mainly through:", "o": ["Specialized knowledge only", "Identification, liking, and respect", "Punishment and deprivation", "Formal position only"], "a": 1, "e": ""}, {"q": "Legitimate power is based on:", "o": ["A perceived right to prescribe behavior due to position or norm", "Specialized knowledge only", "Attraction and identification only", "Ability to provide rewards only"], "a": 0, "e": ""}, {"q": "Expert power comes from:", "o": ["Formal position only", "Punishment authority only", "Emotional attraction only", "Knowledge, skill, or expertise"], "a": 3, "e": ""}, {"q": "A member trained in livelihood work influences group decisions about a livelihood project. This is:", "o": ["Reward power", "Legitimate power only", "Expert power", "Coercive power"], "a": 2, "e": ""}, {"q": "Position theory of leadership emphasizes:", "o": ["Leader traits as the sole basis", "The leader’s topmost position or formal authority", "Leadership as a function of the situation only", "Distributed functions among members"], "a": 1, "e": ""}, {"q": "Trait theory is also known as:", "o": ["Great person theory", "Distributed-functions approach", "Interactional model", "Situational leadership theory"], "a": 0, "e": ""}, {"q": "Authoritarian leadership is characterized by:", "o": ["Maximum member participation in all decisions", "Minimum input from the leader", "Equal focus on worker, group, members, and environment", "Leader setting goals, policies, plans, and member activities"], "a": 3, "e": ""}, {"q": "Democratic leadership is characterized by:", "o": ["Avoidance of all leader input", "Leadership based only on traits", "Maximum involvement and participation from members", "Absolute leader power"], "a": 2, "e": ""}, {"q": "Laissez-faire leadership is characterized by:", "o": ["Formal top-position control", "Minimum leader input or participation", "Leader domination of all decisions", "Strong presiding authority"], "a": 1, "e": ""}, {"q": "Situational theory holds that leadership depends mainly on:", "o": ["The situation", "Inherited traits only", "Formal election only", "Reward power only"], "a": 0, "e": ""}, {"q": "Functional leadership theory views leadership from:", "o": ["A purely positional hierarchy", "Personal traits only", "Coercive authority only", "A group perspective with distributed functions"], "a": 3, "e": ""}, {"q": "The interactional model gives equal focus to:", "o": ["Rewards and coercive sanctions only", "Task completion and written reports only", "Group, worker, members, and environment", "Leader traits and formal appointment only"], "a": 2, "e": ""}, {"q": "Role structure matters because all groups require members to perform:", "o": ["Only observer roles", "A variety of roles", "One identical role", "Only leader roles"], "a": 1, "e": ""}, {"q": "Norms are group rules and standards that emerge through:", "o": ["Interaction", "Agency budget preparation", "Diagnosis only", "Public recruitment only"], "a": 0, "e": ""}, {"q": "Status in a group refers to:", "o": ["The worker’s professional title only", "The agency source of support", "The group’s public announcement", "Rank or standing based on position, activity, communication, or characteristics"], "a": 3, "e": ""}, {"q": "Conformity means:", "o": ["Sharp disagreement between parties", "Acceptance of proposals without review", "Yielding to majority or group pressure", "Joint effort toward shared goals"], "a": 2, "e": ""}, {"q": "Competition tends to decrease:", "o": ["Ineffective communication", "Creativity, coordination, helping, sharing, and cohesion", "Suspicion and mistrust", "Negative attitudes toward the group"], "a": 1, "e": ""}, {"q": "Cooperation tends to increase:", "o": ["Creativity, coordination, helping, sharing, and problem-solving skills", "Suspicion and mistrust", "Negative attitudes toward group tasks", "Dislike among members"], "a": 0, "e": ""}, {"q": "Decision-making in groups is valuable because it allows:", "o": ["Avoidance of member participation", "Replacement of group goals with worker goals", "Elimination of conflict by silence", "Pooling of knowledge, attitudes, and resources"], "a": 3, "e": ""}, {"q": "Groupthink is problematic because proposals are accepted:", "o": ["Only after minority views are protected", "Through balanced conflict resolution", "Without careful review of advantages and disadvantages", "After careful democratic deliberation"], "a": 2, "e": ""}, {"q": "A member raises objections but is pressured to agree for the sake of loyalty. This is:", "o": ["Reintegration", "Groupthink", "Cooperation", "Guided group interaction"], "a": 1, "e": ""}, {"q": "Conflict requires at least two parties and perceived:", "o": ["Mutually exclusive goals or values", "Complete agreement on goals", "Absence of interaction", "No emotional involvement"], "a": 0, "e": ""}, {"q": "Group cohesiveness is the degree to which members:", "o": ["Compete for dominance", "Avoid norms and roles", "Act only as an aggregate", "Desire to remain in the group"], "a": 3, "e": ""}, {"q": "Program media are:", "o": ["Only member demographic profiles", "Only agency funding sources", "Activities, verbal or nonverbal, used to achieve group goals", "Only written case records"], "a": 2, "e": ""}, {"q": "Program media are selected based on factors including goals, member objectives, time, space, age, culture, mood, resources, and:", "o": ["Only leadership style", "Worker’s skills and capacities", "Only worker preference", "Only agency publicity"], "a": 1, "e": ""}, {"q": "A worker choosing a role-play activity for adolescents must consider:", "o": ["Age, skill level, emotional-social characteristics, culture, and objectives", "Only the worker’s favorite activity", "Only the availability of printed forms", "Only the group’s termination date"], "a": 0, "e": ""}, {"q": "Program media can be used to:", "o": ["Replace all group goals", "Prevent members from participating", "Remove the need for planning", "Modify attitudes and behavior, promote interaction, and facilitate group stages"], "  termination", "A task group with formal officers", "The initial stage before true group dynamics are present"], "a": 3, "e": ""}, {"q": "A groupwork proposal should contain rationale, target client, need/problem, membership criteria, resources, procedures, and:", "o": ["Post-termination friendship plan", "Power structure ranking", "Timeframe", "Final attendance record"], "a": 2, "e": ""}, {"q": "Recruitment may be conducted through announcements in barangays, community centers, health centers, and:", "o": ["Only formal treatment groups", "Agency waiting rooms", "Only terminal evaluation sessions", "Only court hearings"], "a": 1, "e": ""}, {"q": "Preparing logistics includes personnel, facilities, and:", "o": ["Materials such as play therapy materials, audiovisual aids, and forms", "Only group goals and norms", "Only termination summaries", "Only power base analysis"], "a": 0, "e": ""}, {"q": "Pre-group interviews usually discuss agency purpose, expectations, likely activities, duration, and:", "o": ["Final group cohesion score", "Member status hierarchy only", "Power manipulation strategies", "Basis for termination of membership"], "a": 3, "e": ""}, {"q": "Group membership is not permanent; this should be clarified during:", "o": ["Final actual session only", "After group disintegration", "Pre-group/intake interviews", "Post-termination only"], "a": 2, "e": ""}, {"q": "Individual client profiles should include identifying data, relevant needs/problems, strengths/resources/limitations, and:", "o": ["Program media classification only", "Worker observations or comments", "Groupthink symptoms only", "Final leadership election result"], "a": 1, "e": ""}, {"q": "Group composition involves selecting members and deciding:", "o": ["Group size", "Only group venue", "Only leader style", "Only termination date"], "a": 0, "e": ""}, {"q": "Vinter’s phrase “compatibility or complementarity and not identity” means members should be:", "o": ["Identical in all characteristics", "Chosen randomly without assessment", "Selected only by age", "Able to function together without needing to be exactly alike"], "a": 3, "e": ""}, {"q": "Sue Henry’s guidance on group composition emphasizes assembling persons with potential to:", "o": ["Compete for leader status", "Avoid shared concern", "Coalesce and function as an entity", "Remain separate individuals without interaction"], "a": 2, "e": ""}, {"q": "A treatment group is usually kept smaller to allow:", "o": ["Public advocacy only", "More intensive and confidential sharing", "More formal task delegation", "Mass participation"], "a": 1, "e": ""}, {"q": "A task group may be larger when:", "o": ["Varied talents and skills help complete the task", "Confidential therapeutic sharing is the main aim", "Members need deep personal disclosure", "The group has no defined goal"], "a": 0, "e": ""}, {"q": "Sue Henry’s size guideline is to keep the group between:", "o": ["2 and 7 for all groups", "15 and 50 regardless of purpose", "1 and 3 only", "4 and 20, guided by purpose"], "a": 3, "e": ""}, {"q": "Group formation phase is when the group:", "o": ["Operates as a mature performing group", "Completes terminal evaluation", "Gets organized and develops beginning participation", "Ends its helping relationship"], "a": 2, "e": ""}, {"q": "Unfreezing or GTKY exercises are used during formation mainly to:", "o": ["Replace goal-setting", "Help participants connect and begin participation", "Produce terminal evaluation", "Create coercive power"], "a": 1, "e": ""}, {"q": "During formation, the group should agree on common concern, norms/rules, schedule/venue, and:", "o": ["Group goals", "Post-termination friendship rules only", "Final evaluation records only", "Power hierarchy rankings"], "a": 0, "e": ""}, {"q": "Group norms may include rules on attendance, punctuality, tasks, free expression, no violence, and:", "o": ["Coercion", "Out-group formation", "Leader domination", "Confidentiality"], "a": 3, "e": ""}, {"q": "The major aim of formation is to establish participation that develops a beginning sense of:", "o": ["Competition", "Manipulation", "Belonging", "Termination"], "a": 2, "e": ""}, {"q": "Group goal determination is a process involving:", "o": ["Denial and acceptance", "Exploration and bargaining", "Reward and coercion", "Diagnosis and prognosis only"], "a": 1, "e": ""}, {"q": "Exploration in goal-setting involves:", "o": ["Discussing mutual concerns and incorporating individual interests into common goals", "Terminating uncommitted members immediately", "Avoiding conflicting interests", "Letting the worker set all goals"], "a": 0, "e": ""}, {"q": "Bargaining in goal-setting involves:", "o": ["Assigning punishments for nonattendance", "Avoiding open discussion", "Rejecting majority acceptability", "Agreeing on concerns or issues confronting the group"], "a": 3, "e": ""}, {"q": "SMART aims should be specific, measurable, achievable, relevant, and:", "o": ["Taskless/tentative/temporary", "Total/transferable/terminal only", "Time/timely/tangible", "Therapeutic/traditional/technical"], "a": 2, "e": ""}, {"q": "A written contract in group formation helps clarify:", "o": ["Only power bases", "Goals, expectations, responsibilities, and agreement", "Only final termination rituals", "Only worker authority"], "a": 1, "e": ""}, {"q": "Group dynamics exercises are best understood as:", "o": ["One kind of program media used for specific objectives", "The entire definition of groupwork", "Always the goal of groupwork", "A substitute for assessment and planning"], "a": 0, "e": ""}, {"q": "Integration occurs when:", "o": ["Members avoid participation and withdraw", "The worker publicly announces the group", "Members meet for the first time", "Interpersonal ties increase and a “we feeling” becomes apparent"], "a": 3, "e": ""}, {"q": "Disintegration is marked by:", "o": ["High cohesion and interdependence", "Terminal evaluation only", "Conflict, anger, frustration, and hostility", "Stable norms and cooperation"], "a": 2, "e": ""}, {"q": "Reintegration means:", "o": ["Immediate termination after conflict", "A higher and more stable level of integration", "The first meeting of prospective members", "Permanent withdrawal from group goals"], "a": 1, "e": ""}, {"q": "Group functioning and maintenance phase is best described as:", "o": ["Maturation of the group and stabilization of patterns", "Private pre-group planning only", "Initial recruitment only", "The final goodbye session"], "a": 0, "e": ""}, {"q": "Plan implementation is:", "o": ["Only identifying prospective members", "Only setting membership criteria", "Only evaluating outcomes", "Doing the decided through activities, worker intervention, and group action"], "a": 3, "e": ""}, {"q": "Worker roles during plan implementation may include therapist, counselor, crisis intervenor, mobilizer, educator, resource person, enabler, and:", "o": ["Out-group member", "Status ranker", "Advocate", "Aggregate observer"], "a": 2, "e": ""}, {"q": "The direct stance views the worker as:", "o": ["Post-termination observer", "Guide and presider", "Ordinary member only", "Absent consultant only"], "a": 1, "e": ""}, {"q": "The facilitating stance is appropriate when members have participation experience, capability, and:", "o": ["Some independent strength", "No capacity for interaction", "No shared concern", "A need for worker domination"], "a": 0, "e": ""}, {"q": "The permissive stance means the worker:", "o": ["Completely abandons responsibility", "Controls every member decision", "Avoids all human relations expertise", "Uses expertise and agency link when appropriate without abdicating function"], "a": 3, "e": ""}, {"q": "The flexible stance requires the worker to:", "o": ["Avoid responding to member behavior", "Let the group function without assessment", "Shift stance based on assessment of group progress, needs, capacities, and problems", "Use only one stance throughout all sessions"], "a": 2, "e": ""}, {"q": "A closed group is one where members:", "o": ["Are only aggregates", "Begin and end together at the same time", "Enter and leave at any time", "Never terminate"], "a": 1, "e": ""}, {"q": "An open group is one where members:", "o": ["Enter and leave at different times for different reasons", "Always begin and end together", "Cannot admit new members", "Are selected only during private pre-group phase"], "a": 0, "e": ""}, {"q": "Regular evaluation is:", "o": ["Only the last actual session", "Only post-termination follow-up", "Only public recruitment assessment", "Ongoing evaluation during plan implementation"], "a": 3, "e": ""}, {"q": "Terminal evaluation is done primarily to assess:", "o": ["Power bases before leadership selection", "Program media before formation only", "Outcome of helping efforts before termination", "Potential members before intake"], "a": 2, "e": ""}, {"q": "Which record is useful as an evaluation tool?", "o": ["Only public announcement posters", "Attendance records and process/summary recordings", "Only leadership theory notes", "Only worker personal diary unrelated to sessions"], "a": 1, "e": ""}, {"q": "Termination may be done when:", "o": ["Groupwork goals have been substantially achieved", "Members first meet", "Group norms are just beginning to evolve", "Recruitment has just been announced"], "a": 0, "e": ""}, {"q": "Groupwork may be discontinued when:", "o": ["Members begin to communicate", "The worker conducts intake interviews", "A written contract is drafted", "There is very little movement toward agreed goals after a reasonable period"], "a": 3, "e": ""}, {"q": "Pretermination involves:", "o": ["The initial private idea of organizing a group", "The first GTKY exercise only", "Acknowledging that the group is about to end and addressing feelings", "The first announcement of a proposed group"], "a": 2, "e": ""}, {"q": "Termination is:", "o": ["The selection of program media", "The last actual session of the group or member", "The planning of follow-up after ending", "The initial public announcement"], "a": 1, "e": ""}, {"q": "Post-termination consists of:", "o": ["Follow-up plans on individual or group basis", "The first meeting of members", "Initial assessment of prospective members", "Bargaining over group goals"], "a": 0, "e": ""}, {"q": "Tuckman’s forming stage is characterized by:", "o": ["Conflict resolution and cohesion", "Full task-focused working capacity", "Closure and separation", "Testing, dependence, orientation, and exploration of acceptable behavior"], "a": 3, "e": ""}, {"q": "Tuckman’s storming stage is characterized by:", "o": ["Harmony and acceptance only", "Final separation and closure", "Expression of individuality, resistance, and competition for power", "Initial dependence and testing only"], "a": 2, "e": ""}, {"q": "Tuckman’s norming stage is characterized by:", "o": ["Final closure only", "Conflict resolution, cohesion, acceptance, and refocus on goals", "Initial testing and dependence only", "Strong resistance to structure only"], "a": 1, "e": ""}, {"q": "Tuckman’s performing stage is also called the working stage because members:", "o": ["Focus on intended goals and constructive action", "First test acceptable behavior", "Primarily resist group structure", "Prepare for separation only"], "a": 0, "e": ""}, {"q": "Adjourning deals with:", "o": ["Orientation and dependence", "Competition for power", "Development of norms only", "Closure, separation, and ending issues"], "a": 3, "e": ""}, {"q": "The developmental approach sees people on a scale from socially functional to dysfunctional to:", "o": ["Pathological", "Coercive", "Eufunctional", "Classificatory"], "a": 2, "e": ""}, {"q": "A key feature of the developmental approach is recognizing the human being as:", "o": ["An aggregate member without identity", "The main resource to be utilized", "A passive patient needing diagnosis only", "A problem to be controlled by the worker"], "a": 1, "e": ""}, {"q": "Another key feature of the developmental approach is focus on:", "o": ["Interpersonal relationships and social role performance", "Only psychiatric symptoms", "Only agency eligibility", "Only leadership election"], "a": 0, "e": ""}, {"q": "The humanistic theme of the developmental approach emphasizes:", "o": ["Uniform treatment of all members", "Worker authority over group choices", "Coercive control of group norms", "Each person’s unique and special function"], "a": 3, "e": ""}, {"q": "Member-to-member helping in the developmental approach is important because it:", "o": ["Prevents free communication", "Makes group goals unnecessary", "Supports member growth with the worker as enabler", "Replaces all worker function"], "a": 2, "e": ""}, {"q": "A developmental group worker should be real and understandable with openness, authenticity, compassion, and:", "o": ["Minimal contact and avoidance", "Support, expectations, and assistance", "Punishment, secrecy, and domination", "Coercion, diagnosis, and termination only"], "a": 1, "e": ""}, {"q": "The remedial model is considered clinical because it seeks to:", "o": ["Improve social functioning of the socially maladapted through guided group experience", "Mobilize community resources for livelihood only", "Create leisure-time recreation for all groups", "Focus only on task completion"], "a": 0, "e": ""}, {"q": "The remedial model uses the group as:", "o": ["An aggregate without interaction", "A public announcement mechanism", "A task committee only", "Context and means for altering deviant behavior"], "a": 3, "e": ""}, {"q": "Vinter’s treatment sequence begins with:", "o": ["Group development and treatment", "Group composition and formation", "Intake", "Evaluation and termination"], "a": 2, "e": ""}, {"q": "In Vinter’s sequence, diagnosis and treatment planning come before:", "o": ["Tuckman’s adjourning", "Group composition and formation", "Evaluation and termination", "Post-termination follow-up"], "a": 1, "e": ""}, {"q": "The interactionist or reciprocal model emphasizes:", "o": ["Mediating person and environment/group systems", "Only individual pathology", "Only recreational activities", "Only agency funding"], "a": 0, "e": ""}, {"q": "The phases of the interactionist approach include tuning in, beginning, task, and:", "o": ["Storming and norming", "Private and public pre-group", "Reward and coercion", "Transition and ending"], "a": 3, "e": ""}, {"q": "Treatment groups, according to Toseland and Rivas, mainly meet:", "o": ["Agency administrative reporting needs", "Community policy monitoring only", "Members’ socio-emotional needs", "External goals not linked to member needs"], "a": 2, "e": ""}, {"q": "Task groups, according to Toseland and Rivas, mainly accomplish:", "o": ["Only psychoeducation and insight", "Goals not intrinsically or immediately linked to members’ needs", "Members’ therapy and mutual aid needs", "Only emotional support and growth"], "a": 1, "e": ""}, {"q": "A group counseling session for coping with grief is best categorized as:", "o": ["Treatment group", "Task group", "Aggregate", "Public pre-group phase"], "a": 0, "e": ""}, {"q": "A board tasked with monitoring program implementation is best categorized as:", "o": ["Treatment group", "Growth group", "Therapy group", "Task group"], "a": 3, "e": ""}, {"q": "Trecker’s principle of planned group formation concerns:", "o": ["Only power base selection", "Only worker self-awareness", "Size, age, and common needs or problems of members", "Only final evaluation"], "a": 2, "e": ""}, {"q": "The principle of specific objectives requires objectives to be:", "o": ["Written only after termination", "Consciously formulated for individual and group development", "Kept vague to allow worker control", "Based only on agency preference"], "a": 1, "e": ""}, {"q": "Purposeful worker-group relationship is based on:", "o": ["Mutual acceptance and trust", "Worker domination", "Coercive power", "Member dependence only"], "a": 0, "e": ""}, {"q": "Continuous individuali ought of forming a group and has not yet announced it. The phase is:", "o": ["Group formation phase", "Private pre-group phase", "Public pre-group phase", "Convening phase"], "a": 1, "e": ""}, {"q": "A group service has been approved and posters are placed in the barangay hall. The phase is:", "o": ["Public pre-group phase", "Private pre-group phase", "Termination phase", "Group functioning phase"], "a": 0, "e": ""}, {"q": "A group begins with GTKY exercises and agrees on norms, schedule, confidentiality, and goals. The phase is:", "o": ["Pretermination phase", "Post-termination phase", "Disintegration phase", "Group formation phase"], "a": 3, "e": ""}, {"q": "Members begin feeling “we are in this together” and participate enthusiastically. This reflects:", "o": ["Pre-group phase", "Groupthink", "Integration", "Disintegration"], "a": 2, "e": ""}, {"q": "Conflict and hostility emerge after members disagree on priorities. This reflects:", "o": ["Performing only", "Disintegration", "Integration", "Pretermination"], "a": 1, "e": ""}, {"q": "After conflict, members rebuild clearer norms and cooperate at a more stable level. This reflects:", "o": ["Reintegration", "Private pre-group phase", "Aggregate formation", "Elimination"], "a": 0, "e": ""}, {"q": "A social worker dominates goal-setting and ignores member input. Which principle is most violated?", "o": ["Resource utilization", "Status hierarchy", "Expert power", "Democratic self-determination"], "a": 3, "e": ""}, {"q": "A group worker notices quiet members are not participating and uses questions to invite their views. The worker is using skill in:", "o": ["Coercive power", "Termination", "Meaningful participation", "Evaluation only"], "a": 2, "e": ""}, {"q": "A member uses specialized knowledge about livelihood grants to influence group planning. This demonstrates:", "o": ["Coercive power", "Expert power", "Referent power", "Reward power"], "a": 1, "e": ""}, {"q": "Members follow a respected peer because they identify with her values and admire her. This is:", "o": ["Referent power", "Legitimate power", "Coercive power", "Expert power"], "a": 0, "e": ""}, {"q": "Members comply with an elected president’s directions because they accept the position’s authority. This is:", "o": ["Referent power", "Reward power", "Expert power", "Legitimate power"], "a": 3, "e": ""}, {"q": "A worker threatens loss of privileges if members do not attend. This uses:", "o": ["Expert power", "Democratic power", "Coercive power", "Referent power"], "a": 2, "e": ""}, {"q": "The worker praises members for completing tasks, and members value the praise. This is:", "o": ["Expert power", "Reward power", "Coercive power", "Legitimate power"], "a": 1, "e": ""}, {"q": "A group pressures a dissenting member to stay silent to preserve harmony. The process is:", "o": ["Groupthink", "Cooperation", "Integration", "Democratic self-determination"], "a": 0, "e": ""}, {"q": "Members work together, share roles, and improve problem-solving. The process is:", "o": ["Competition", "Conflict", "Groupthink", "Cooperation"], "a": 3, "e": ""}, {"q": "Subgroups compete for control and communication becomes suspicious and ineffective. The process is:", "o": ["Cohesiveness", "Guided interaction", "Competition", "Cooperation"], "a": 2, "e": ""}, {"q": "A group uses role play to practice assertive communication. The activity is:", "o": ["Evaluation record", "Program media", "Power base", "Group norm"], "a": 1, "e": ""}, {"q": "A social worker chooses art activities for children after considering age, attention span, culture, resources, and objectives. This shows:", "o": ["Appropriate program media selection", "Leader-centered communication", "Coercive power", "Post-termination planning"], "a": 0, "e": ""}, {"q": "A parent effectiveness group wants to address gambling dens affecting families. The worker asks whether agency support can extend to community action. This relates to:", "o": ["Role structure only", "Affectional structure only", "Terminal evaluation", "Enlisting community support"], "a": 3, "e": ""}, {"q": "A treatment group has 18 members and members avoid personal sharing. What adjustment is most consistent with the reviewer?", "o": ["Remove all norms", "Use only leader-centered communication", "Reduce size to allow intensive and confidential sharing", "Increase size to improve disclosure"], "a": 2, "e": ""}, {"q": "A task group lacks needed skills to complete a project. What composition issue is most relevant?", "o": ["Need to make members identical", "Need for varied talents and skills", "Need for maximum confidentiality", "Need to avoid complementarity"], "a": 1, "e": ""}, {"q": "A worker changes from direct to facilitating stance as members become more capable. This is:", "o": ["Flexible stance", "Permissive withdrawal", "Authoritarian style", "Trait leadership"], "a": 0, "e": ""}, {"q": "A group whose members enter and leave as their treatment schedules change is:", "o": ["Closed group", "Primary group", "Aggregate", "Open group"], "a": 3, "e": ""}, {"q": "A class-based psychoeducation group begins and ends with the same members. This is:", "o": ["Aggregate", "Out-group", "Closed group", "Open group"], "a": 2, "e": ""}, {"q": "A worker conducts ongoing review of attendance and session recordings to modify plans. This is:", "o": ["Post-termination follow-up", "Regular evaluation", "Terminal evaluation only", "Pre-group interview"], "a": 1, "e": ""}, {"q": "After the last session, the worker arranges follow-up consultation options. This is:", "o": ["Post-termination", "Convening", "Storming", "Exploration"], "a": 0, "e": ""}, {"q": "A group is newly formed and members test what behavior is acceptable. In Tuckman’s model, this is:", "o": ["Storming", "Norming", "Performing", "Forming"], "a": 3, "e": ""}, {"q": "Members resist structure and compete for influence. In Tuckman’s model, this is:", "o": ["Norming", "Adjourning", "Storming", "Forming"], "a": 2, "e": ""}, {"q": "Members role is:", "o": ["Observer only", "Coercive leader", "Out-group member", "Resource utilization/liaison role"], "a": 3, "e": ""}, {"q": "A worker tracks individual and group progress across meetings. The role is:", "o": ["Motivator", "Guide only", "Observer", "Mediator"], "a": 2, "e": ""}, {"q": "A worker helps the group design rules and procedures for meetings. The role is:", "o": ["Information provider only", "Guide", "Educator only", "Observer only"], "a": 1, "e": ""}, {"q": "A worker provides knowledge about agency services and community resources. The role is:", "o": ["Information provider", "Supervisor only", "Mediator only", "Facilitator only"], "a": 0, "e": ""}, {"q": "A worker encourages members to share ideas freely without criticism during planning. The technique is:", "o": ["Coercive power", "Groupthink", "Elimination", "Brainstorming"], "a": 3, "e": ""}, {"q": "A worker says what she really thinks at an appropriate time to support honest group process. This is:", "o": ["Groupthink", "Reward power", "Leveling", "Subjugation"], "a": 2, "e": ""}]; const quiz = document.getElementById('quiz'); const toc = document.getElementById('toc'); const letter = i => ['A', 'B', 'C', 'D'][i];
        function isSituational(q) {return /client|worker|member|group|parents|youth|barangay|association|committee|patients|family|crowd|survivor|tenants|social worker|members/i.test(q.q)}
        questions.forEach((item, i) => {if (i % 20 === 0) {const a = document.createElement('a'); a.href = '#q' + (i + 1); a.textContent = `Questions ${i + 1}-${Math.min(i + 20, questions.length)}`; toc.appendChild(a);} const card = document.createElement('article'); card.className = 'qcard'; card.id = 'q' + (i + 1); const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = isSituational(item) ? 'Situational / Application' : 'Conceptual / Recall'; card.appendChild(tag); const title = document.createElement('div'); title.className = 'qtitle'; title.textContent = `${i + 1}. ${item.q}`; card.appendChild(title); const opts = document.createElement('div'); opts.className = 'options'; item.o.forEach((opt, j) => {const lab = document.createElement('label'); lab.className = 'option'; lab.dataset.q = i; lab.dataset.o = j; lab.innerHTML = `<input type="radio" name="q${i}" value="${j}"> <span><strong>${letter(j)}.</strong> ${opt}</span>`; opts.appendChild(lab);}); card.appendChild(opts); const ans = document.createElement('div'); ans.className = 'answer'; ans.id = 'ans' + i; ans.textContent = `Correct answer: ${letter(item.a)}. ${item.o[item.a]}`; card.appendChild(ans); if (item.e) {const ex = document.createElement('div'); ex.className = 'explain'; ex.id = 'exp' + i; ex.textContent = 'Explanation: ' + item.e; card.appendChild(ex);} quiz.appendChild(card);});
        function submitQuiz() {let score = 0, answered = 0; document.querySelectorAll('label.option').forEach(l => l.classList.remove('correct', 'wrong')); questions.forEach((item, i) => {const selected = document.querySelector(`input[name="q${i}"]:checked`); const labels = document.querySelectorAll(`label[data-q="${i}"]`); labels[item.a].classList.add('correct'); if (selected) {answered++; const val = Number(selected.value); if (val === item.a) score++; else labels[val].classList.add('wrong');} document.getElementById('ans' + i).classList.add('show'); const ex = document.getElementById('exp' + i); if (ex) ex.classList.add('show');}); const pct = ((score / questions.length) * 100).toFixed(2); document.getElementById('scoreBox').innerHTML = `<strong>Score: ${score} / ${questions.length} (${pct}%)</strong><br>Answered: ${answered} / ${questions.length}`; window.scrollTo({top: 0, behavior: 'smooth'});}
        function showAnswers() {document.querySelectorAll('label.option').forEach(l => l.classList.remove('correct', 'wrong')); questions.forEach((item, i) => {document.querySelectorAll(`label[data-q="${i}"]`)[item.a].classList.add('correct'); document.getElementById('ans' + i).classList.add('show'); const ex = document.getElementById('exp' + i); if (ex) ex.classList.add('show');});}
        function resetQuiz() {document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false); document.querySelectorAll('label.option').forEach(l => l.classList.remove('correct', 'wrong')); document.querySelectorAll('.answer,.explain').forEach(a => a.classList.remove('show')); document.getElementById('scoreBox').textContent = 'Score: Not submitted yet.'; window.scrollTo({top: 0, behavior: 'smooth'});}

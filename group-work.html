ber input. Which principle is most violated?", "o": ["Group-centered communication", "Democratic self-determination", "Leader-centered communication", "Progressive program experience"], "a": 1, "e": "Original correct concept: Democratic self-determination"}, {"q": "A group worker notices quiet members are not participating and uses questions to invite their views. The worker is using skill in:", "o": ["Guided group interaction", "Treatment group category", "Member-to-member helping", "Meaningful participation"], "a": 3, "e": "Original correct concept: Meaningful participation"}, {"q": "A member uses specialized knowledge about livelihood grants to influence group planning. This demonstrates:", "o": ["Group status", "Expert power", "Reward power", "Member roles"], "a": 1, "e": "Original correct concept: Expert power"}, {"q": "Members follow a respected peer because they identify with her values and admire her. This is:", "o": ["Coercive power", "Remedial model", "Therapy group", "Referent power"], "a": 3, "e": "Original correct concept: Referent power"}, {"q": "Members comply with an elected president’s directions because they accept the position’s authority. This is:", "o": ["Humanistic theme", "Legitimate power", "Mutual aid group", "Reciprocal model"], "a": 1, "e": "Original correct concept: Legitimate power"}, {"q": "A worker threatens loss of privileges if members do not attend. This uses:", "o": ["Referent power", "Remedial model", "Therapy group", "Coercive power"], "a": 3, "e": "Original correct concept: Coercive power"}, {"q": "The worker praises members for completing tasks, and members value the praise. This is:", "o": ["Group status", "Reward power", "Expert power", "Member roles"], "a": 1, "e": "Original correct concept: Reward power"}, {"q": "A group pressures a dissenting member to stay silent to preserve harmony. The process is:", "o": ["Conformity", "Compromise", "Task group", "Groupthink"], "a": 3, "e": "Original correct concept: Groupthink"}, {"q": "Members work together, share roles, and improve problem-solving. The process is:", "o": ["Elimination", "Cooperation", "Group norms", "Competition"], "a": 1, "e": "Original correct concept: Cooperation"}, {"q": "Subgroups compete for control and communication becomes suspicious and ineffective. The process is:", "o": ["Group norms", "Cooperation", "Elimination", "Competition"], "a": 3, "e": "Original correct concept: Competition"}, {"q": "A group uses role play to practice assertive communication. The activity is:", "o": ["Natural group", "Program media", "Therapy group", "Support group"], "a": 1, "e": "Original correct concept: Program media"}, {"q": "A social worker chooses art activities for children after considering age, attention span, culture, resources, and objectives. This shows:", "o": ["Purposeful worker-group relationship", "Responsible group decision-making", "Activity selection by objectives", "Appropriate program media selection"], "a": 3, "e": "Original correct concept: Appropriate program media selection"}, {"q": "A parent effectiveness group wants to address gambling dens affecting families. The worker asks whether agency support can extend to community action. This relates to:", "o": ["Evaluation at crucial stages", "Enlisting community support", "Group-centered communication", "Continuous individualization"], "a": 1, "e": "Original correct concept: Enlisting community support"}, {"q": "A treatment group has 18 members and members avoid personal sharing. What adjustment is most consistent with the reviewer?", "o": ["Purposeful worker-group relationship", "Responsible group decision-making", "Agency waiting-room recruitment", "Reduce size to allow intensive and confidential sharing"], "a": 3, "e": "Original correct concept: Reduce size to allow intensive and confidential sharing"}, {"q": "A task group lacks needed skills to complete a project. What composition issue is most relevant?", "o": ["Agency waiting-room recruitment", "Need for varied talents and skills", "Responsible group decision-making", "Purposeful worker-group relationship"], "a": 1, "e": "Original correct concept: Need for varied talents and skills"}, {"q": "A worker changes from direct to facilitating stance as members become more capable. This is:", "o": ["Position theory", "Decision-making", "Power structure", "Flexible stance"], "a": 3, "e": "Original correct concept: Flexible stance"}, {"q": "A group whose members enter and leave as their treatment schedules change is:", "o": ["Compromise", "Open group", "Conformity", "Groupthink"], "a": 1, "e": "Original correct concept: Open group"}, {"q": "A class-based psychoeducation group begins and ends with the same members. This is:", "o": ["Growth group", "Formed group", "Member roles", "Closed group"], "a": 3, "e": "Original correct concept: Closed group"}, {"q": "A worker conducts ongoing review of attendance and session recordings to modify plans. This is:", "o": ["Planned program use", "Regular evaluation", "Friendship network", "Specific objectives"], "a": 1, "e": "Original correct concept: Regular evaluation"}, {"q": "After the last session, the worker arranges follow-up consultation options. This is:", "o": ["Mutual aid group", "Reciprocal model", "Humanistic theme", "Post-termination"], "a": 3, "e": "Original correct concept: Post-termination"}, {"q": "A group is newly formed and members test what behavior is acceptable. In Tuckman’s model, this is:", "o": ["Conflict", "Forming", "Norming", "Storming"], "a": 1, "e": "Original correct concept: Forming"}, {"q": "Members resist structure and compete for influence. In Tuckman’s model, this is:", "o": ["Conflict", "Alliance", "In-group", "Storming"], "a": 3, "e": "Original correct concept: Storming"}, {"q": "Members resolve conflict, accept one another, and refocus on goals. This is:", "o": ["Conflict", "Norming", "Forming", "Storming"], "a": 1, "e": "Original correct concept: Norming"}, {"q": "Members work productively toward intended goals and negotiate disagreements effectively. This is:", "o": ["Adjourning", "Conformity", "Groupthink", "Performing"], "a": 3, "e": "Original correct concept: Performing"}, {"q": "The worker attends to separation and closure as the group ends. This is:", "o": ["Groupthink", "Adjourning", "Performing", "Conformity"], "a": 1, "e": "Original correct concept: Adjourning"}, {"q": "A group of unemployed youth develops skills and self-confidence through member-to-member helping. This fits:", "o": ["Agency-sponsored group", "Affectional structure", "Flexible organization", "Developmental approach"], "a": 3, "e": "Original correct concept: Developmental approach"}, {"q": "A group for youth with maladaptive behaviors uses guided group experience to improve social functioning. This fits:", "o": ["Natural group", "Remedial model", "Therapy group", "Support group"], "a": 1, "e": "Original correct concept: Remedial model"}, {"q": "A worker focuses on mediating between the needs of members and their social environment. This fits:", "o": ["Responsible group decision-making", "Purposeful worker-group relationship", "Progressive program experience", "Interactionist or reciprocal model"], "a": 3, "e": "Original correct concept: Interactionist or reciprocal model"}, {"q": "A member tries to remove an opposing subgroup from the group. This reaction is:", "o": ["Cooperation", "Elimination", "Group norms", "Competition"], "a": 1, "e": "Original correct concept: Elimination"}, {"q": "Two subgroups give up some demands to preserve the group. This reaction is:", "o": ["Conformity", "Groupthink", "Task group", "Compromise"], "a": 3, "e": "Original correct concept: Compromise"}, {"q": "Subgroups keep their identity but combine suggestions toward a shared goal. This reaction is:", "o": ["Out-group", "Alliance", "Conflict", "In-group"], "a": 1, "e": "Original correct concept: Alliance"}, {"q": "A solution satisfies personal needs and the whole group’s needs. This reaction is:", "o": ["Group norms", "Competition", "Cooperation", "Integration"], "a": 3, "e": "Original correct concept: Integration"}, {"q": "A worker links the group to barangay resources for livelihood materials. The role is:", "o": ["Progressive program experience", "Resource utilization/liaison role", "Responsible group decision-making", "Purposeful worker-group relationship"], "a": 1, "e": "Original correct concept: Resource utilization/liaison role"}, {"q": "A worker tracks individual and group progress across meetings. The role is:", "o": ["Conflict", "Alliance", "In-group", "Observer"], "a": 3, "e": "Original correct concept: Observer"}, {"q": "A worker helps the group design rules and procedures for meetings. The role is:", "o": ["Alliance", "Guide", "Crowd", "Conflict"], "a": 1, "e": "Original correct concept: Guide"}, {"q": "A worker provides knowledge about agency services and community resources. The role is:", "o": ["Pretermination phase", "Resource utilization", "Interactionist model", "Information provider"], "a": 3, "e": "Original correct concept: Information provider"}, {"q": "A worker encourages members to share ideas freely without criticism during planning. The technique is:", "o": ["Natural group", "Brainstorming", "Therapy group", "Support group"], "a": 1, "e": "Original correct concept: Brainstorming"}, {"q": "A worker says what she really thinks at an appropriate time to support honest group process. This is:", "o": ["Conflict", "Alliance", "In-group", "Leveling"], "a": 3, "e": "Original correct concept: Leveling"}]; const quiz=document.getElementById('quiz'); const toc=document.getElementById('toc'); const letter=i=>['A','B','C','D'][i];
function isSituational(q){return /client|worker|member|group|parents|youth|barangay|association|committee|patients|family|crowd|survivor|tenants|social worker|members/i.test(q.q)}
questions.forEach((item,i)=>{if(i%20===0){const a=document.createElement('a');a.href='#q'+(i+1);a.textContent=`Questions ${i+1}-${Math.min(i+20,questions.length)}`;toc.appendChild(a);}const card=document.createElement('article');card.className='qcard';card.id='q'+(i+1);const tag=document.createElement('div');tag.className='tag';tag.textContent=isSituational(item)?'Situational / Application':'Conceptual / Comparison';card.appendChild(tag);const title=document.createElement('div');title.className='qtitle';title.textContent=`${i+1}. ${item.q}`;card.appendChild(title);const opts=document.createElement('div');opts.className='options';item.o.forEach((opt,j)=>{const lab=document.createElement('label');lab.className='option';lab.dataset.q=i;lab.dataset.o=j;lab.innerHTML=`<input type="radio" name="q${i}" value="${j}"> <span><strong>${letter(j)}.</strong> ${opt}</span>`;opts.appendChild(lab);});card.appendChild(opts);const ans=document.createElement('div');ans.className='answer';ans.id='ans'+i;ans.textContent=`Correct answer: ${letter(item.a)}. ${item.o[item.a]}`;card.appendChild(ans);if(item.e){const ex=document.createElement('div');ex.className='explain';ex.id='exp'+i;ex.textContent=item.e;card.appendChild(ex);}quiz.appendChild(card);});
function submitQuiz(){let score=0,answered=0;document.querySelectorAll('label.option').forEach(l=>l.classList.remove('correct','wrong'));questions.forEach((item,i)=>{const selected=document.querySelector(`input[name="q${i}"]:checked`);const labels=document.querySelectorAll(`label[data-q="${i}"]`);labels[item.a].classList.add('correct');if(selected){answered++;const val=Number(selected.value);if(val===item.a)score++;else labels[val].classList.add('wrong');}document.getElementById('ans'+i).classList.add('show');const ex=document.getElementById('exp'+i);if(ex)ex.classList.add('show');});const pct=((score/questions.length)*100).toFixed(2);document.getElementById('scoreBox').innerHTML=`<strong>Score: ${score} / ${questions.length} (${pct}%)</strong><br>Answered: ${answered} / ${questions.length}`;window.scrollTo({top:0,behavior:'smooth'});}
function showAnswers(){document.querySelectorAll('label.option').forEach(l=>l.classList.remove('correct','wrong'));questions.forEach((item,i)=>{document.querySelectorAll(`label[data-q="${i}"]`)[item.a].classList.add('correct');document.getElementById('ans'+i).classList.add('show');const ex=document.getElementById('exp'+i);if(ex)ex.classList.add('show');});}
function resetQuiz(){document.querySelectorAll('input[type="radio"]').forEach(r=>r.checked=false);document.querySelectorAll('label.option').forEach(l=>l.classList.remove('correct','wrong'));document.querySelectorAll('.answer,.explain').forEach(a=>a.classList.remove('show'));document.getElementById('scoreBox').textContent='Score: Not submitted yet.';window.scrollTo({top:0,behavior:'smooth'});}

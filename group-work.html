    const quiz = document.getElementById('quiz');
    const toc = document.getElementById('toc');
    document.getElementById('totalTop').textContent = questions.length;

    function letter(i) { return ['A','B','C','D'][i]; }

    questions.forEach((item, i) => {
      if (i % 20 === 0) {
        const link = document.createElement('a');
        link.href = '#q' + (i+1);
        link.textContent = `Questions ${i+1}-${Math.min(i+20, questions.length)}`;
        toc.appendChild(link);
      }
      const card = document.createElement('article');
      card.className = 'qcard';
      card.id = 'q' + (i+1);
      const title = document.createElement('div');
      title.className = 'qtitle';
      title.textContent = `${i+1}. ${item.q}`;
      card.appendChild(title);
      const opts = document.createElement('div');
      opts.className = 'options';
      item.o.forEach((opt, j) => {
        const lab = document.createElement('label');
        lab.className = 'option';
        lab.dataset.q = i;
        lab.dataset.o = j;
        lab.innerHTML = `<input type="radio" name="q${i}" value="${j}"> <span><strong>${letter(j)}.</strong> ${opt}</span>`;
        opts.appendChild(lab);
      });
      card.appendChild(opts);
      const ans = document.createElement('div');
      ans.className = 'answer';
      ans.id = 'ans' + i;
      ans.textContent = `Correct answer: ${letter(item.a)}. ${item.o[item.a]}`;
      card.appendChild(ans);
      quiz.appendChild(card);
    });

    function submitQuiz() {
      let score = 0, answered = 0;
      document.querySelectorAll('label.option').forEach(l => l.classList.remove('correct','wrong'));
      questions.forEach((item, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        const labels = document.querySelectorAll(`label[data-q="${i}"]`);
        labels[item.a].classList.add('correct');
        if (selected) {
          answered++;
          const val = Number(selected.value);
          if (val === item.a) score++;
          else labels[val].classList.add('wrong');
        }
        document.getElementById('ans' + i).classList.add('show');
      });
      const pct = ((score/questions.length)*100).toFixed(2);
      document.getElementById('scoreBox').innerHTML = `<strong>Score: ${score} / ${questions.length} (${pct}%)</strong><br>Answered: ${answered} / ${questions.length}`;
      window.scrollTo({top:0, behavior:'smooth'});
    }

    function showAnswers() {
      document.querySelectorAll('label.option').forEach(l => l.classList.remove('correct','wrong'));
      questions.forEach((item, i) => {
        document.querySelectorAll(`label[data-q="${i}"]`)[item.a].classList.add('correct');
        document.getElementById('ans' + i).classList.add('show');
      });
    }

    function resetQuiz() {
      document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
      document.querySelectorAll('label.option').forEach(l => l.classList.remove('correct','wrong'));
      document.querySelectorAll('.answer').forEach(a => a.classList.remove('show'));
      document.getElementById('scoreBox').textContent = 'Score: Not submitted yet.';
      window.scrollTo({top:0, behavior:'smooth'});
    }
  </script>
